version: '3.8'

services:
  # Neo4j 图数据库
  neo4j:
    image: neo4j:5.14
    container_name: omnia-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/omnia2026
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - omnia-network

  # Qdrant 向量数据库
  qdrant:
    image: qdrant/qdrant:v1.6.9
    container_name: omnia-qdrant
    ports:
      - "6333:6333"  # HTTP
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - omnia-network

  # Ollama LLM
  ollama:
    image: ollama/ollama:latest
    container_name: omnia-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - omnia-network
    # GPU 支持（可选）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnia-backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=omnia2026
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - neo4j
      - qdrant
      - ollama
    networks:
      - omnia-network
    volumes:
      - ./backend:/app

  # Frontend (开发模式)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omnia-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - omnia-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  omnia-network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  ollama_data:
