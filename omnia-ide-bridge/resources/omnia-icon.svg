<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Omnia Neural Brain Icon -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad)" opacity="0.9"/>
  
  <!-- Neural network nodes -->
  <circle cx="30" cy="35" r="6" fill="white" opacity="0.9"/>
  <circle cx="50" cy="25" r="6" fill="white" opacity="0.9"/>
  <circle cx="70" cy="35" r="6" fill="white" opacity="0.9"/>
  <circle cx="25" cy="55" r="6" fill="white" opacity="0.9"/>
  <circle cx="50" cy="50" r="8" fill="white"/>
  <circle cx="75" cy="55" r="6" fill="white" opacity="0.9"/>
  <circle cx="35" cy="75" r="6" fill="white" opacity="0.9"/>
  <circle cx="50" cy="75" r="6" fill="white" opacity="0.9"/>
  <circle cx="65" cy="75" r="6" fill="white" opacity="0.9"/>
  
  <!-- Neural connections -->
  <line x1="30" y1="35" x2="50" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="50" y1="25" x2="50" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="70" y1="35" x2="50" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="25" y1="55" x2="50" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="75" y1="55" x2="50" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="35" y1="75" x2="50" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <line x1="65" y1="75" x2="50" y2="50" stroke="white" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Outer connections -->
  <line x1="30" y1="35" x2="50" y2="25" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="25" x2="70" y2="35" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="25" y1="55" x2="35" y2="75" stroke="white" stroke-width="1" opacity="0.4"/>
  <line x1="75" y1="55" x2="65" y2="75" stroke="white" stroke-width="1" opacity="0.4"/>
</svg>
