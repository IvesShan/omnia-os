<template id="scene-graph-template">
  <div data-composition-id="scene-graph" data-width="1920" data-height="1080" data-duration="12">
    <div class="screenshot-bg"></div>
    
    <div class="overlay-layer">
      <div class="text-callout" id="graphCallout">
        <div class="callout-title">神经图谱</div>
        <div class="callout-desc">247 个节点 · 568 条边</div>
        <div class="callout-sub">像你的大脑一样理解知识关系</div>
      </div>
    </div>

    <style>
      @font-face { font-family: 'Noto Sans SC'; src: url('../assets/fonts/noto-sans-sc.woff2') format('woff2'); font-display: swap; }
      @font-face { font-family: 'Inter'; src: url('../assets/fonts/inter-latin.woff2') format('woff2'); font-display: swap; }
      [data-composition-id="scene-graph"] {
        position: relative;
        font-family: 'Inter', 'Noto Sans SC', sans-serif;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .screenshot-bg {
        position: absolute;
        inset: 0;
        background-image: url('../assets/real-ui-graph.png');
        background-size: cover;
        background-position: center;
        opacity: 0;
      }

      .overlay-layer {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .text-callout {
        text-align: center;
        opacity: 0;
      }

      .callout-title {
        font-size: 96px;
        font-weight: 900;
        background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .callout-desc {
        font-size: 42px;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.8);
        margin-top: 20px;
      }

      .callout-sub {
        font-size: 28px;
        color: rgba(139, 92, 246, 0.8);
        margin-top: 15px;
      }
    </style>

    <script>
      (function() {
        const tl = gsap.timeline({ paused: true });
        tl.fromTo('.screenshot-bg', { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 2.0, ease: 'power3.out' }, 0);
        tl.fromTo('#graphCallout', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 1.5, ease: 'power3.out' }, 1.5);
        tl.to('.overlay-layer, .screenshot-bg', { opacity: 0, duration: 0.5 }, 11.5);
        window.__timelines = window.__timelines || {};
        window.__timelines["scene-graph"] = tl;
      })();
    </script>
  </div>
</template>
