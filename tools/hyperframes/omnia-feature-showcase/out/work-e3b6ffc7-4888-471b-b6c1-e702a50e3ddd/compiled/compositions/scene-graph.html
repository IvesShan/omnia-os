<template id="scene-graph-template">
  <div data-composition-id="scene-graph" data-width="1920" data-height="1080" data-duration="12">

    <!-- Background -->
    <div class="bg-layer"></div>

    <!-- Neural graph visualization -->
    <div class="graph-viz">
      <!-- Central node -->
      <div class="node central">
        <div class="node-glow"></div>
        <span>你</span>
      </div>

      <!-- Surrounding nodes -->
      <div class="node node-1">
        <div class="node-glow"></div>
        <span>Omnia</span>
      </div>
      <div class="node node-2">
        <div class="node-glow"></div>
        <span>项目</span>
      </div>
      <div class="node node-3">
        <div class="node-glow"></div>
        <span>习惯</span>
      </div>
      <div class="node node-4">
        <div class="node-glow"></div>
        <span>知识</span>
      </div>
      <div class="node node-5">
        <div class="node-glow"></div>
        <span>关系</span>
      </div>

      <!-- Connections -->
      <svg class="connections" width="800" height="800">
        <line class="conn" x1="400" y1="400" x2="200" y2="200" stroke="url(#connGrad)" stroke-width="2"/>
        <line class="conn" x1="400" y1="400" x2="600" y2="200" stroke="url(#connGrad)" stroke-width="2"/>
        <line class="conn" x1="400" y1="400" x2="150" y2="500" stroke="url(#connGrad)" stroke-width="2"/>
        <line class="conn" x1="400" y1="400" x2="650" y2="500" stroke="url(#connGrad)" stroke-width="2"/>
        <line class="conn" x1="400" y1="400" x2="400" y2="650" stroke="url(#connGrad)" stroke-width="2"/>
        <defs>
          <linearGradient id="connGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.6"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <!-- Text overlay -->
    <div class="text-overlay">
      <div class="section-title" id="graphTitle">神经图谱</div>
      <div class="section-desc" id="graphDesc">理解你知识之间的关系</div>
      <div class="section-detail" id="graphDetail">
        自动提取实体和关系<br/>
        构建你的知识网络
      </div>
    </div>

    <style>
      @import url('../assets/fonts/fonts.css');

      [data-composition-id="scene-graph"] {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Inter', 'Noto Sans SC', sans-serif;
      }

      .bg-layer {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(13, 17, 23, 1) 0%, rgba(5, 5, 15, 1) 100%);
      }

      .graph-viz {
        position: absolute;
        left: 100px;
        top: 50%;
        transform: translateY(-50%);
        width: 800px;
        height: 800px;
      }

      .node {
        position: absolute;
        width: 100px;
        height: 100px;
        background: rgba(0, 212, 255, 0.1);
        border: 1px solid rgba(0, 212, 255, 0.3);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.9);
        opacity: 0;
      }

      .node-glow {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        background: rgba(0, 212, 255, 0.15);
        opacity: 0;
      }

      .central {
        left: 350px;
        top: 350px;
        width: 120px;
        height: 120px;
        background: rgba(0, 212, 255, 0.2);
        border-color: rgba(0, 212, 255, 0.5);
        z-index: 10;
      }

      .node-1 { left: 150px; top: 150px; }
      .node-2 { left: 550px; top: 150px; }
      .node-3 { left: 100px; top: 450px; }
      .node-4 { left: 600px; top: 450px; }
      .node-5 { left: 350px; top: 600px; }

      .connections {
        position: absolute;
        top: 0;
        left: 0;
        opacity: 0;
      }

      .conn {
        opacity: 0;
      }

      .text-overlay {
        position: absolute;
        right: 100px;
        top: 50%;
        transform: translateY(-50%);
        text-align: right;
      }

      .section-title {
        font-size: 72px;
        font-weight: 900;
        background: linear-gradient(135deg, #00d4ff 0%, #8b5cf6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        opacity: 0;
      }

      .section-desc {
        font-size: 32px;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.7);
        margin-top: 24px;
        opacity: 0;
      }

      .section-detail {
        font-size: 24px;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.5);
        margin-top: 32px;
        line-height: 1.6;
        opacity: 0;
      }
    </style>

    <script>
      (function() {
        const tl = gsap.timeline({ paused: true });

        // Title appears
        tl.fromTo('#graphTitle',
          { opacity: 0, x: 50 },
          { opacity: 1, x: 0, duration: 1.0, ease: 'power3.out' },
          0.5
        );

        // Description appears
        tl.fromTo('#graphDesc',
          { opacity: 0, x: 50 },
          { opacity: 1, x: 0, duration: 1.0, ease: 'power3.out' },
          1.0
        );

        // Central node appears
        tl.fromTo('.central',
          { opacity: 0, scale: 0.5 },
          { opacity: 1, scale: 1, duration: 1.0, ease: 'back.out(1.4)' },
          1.5
        );

        // Surrounding nodes appear
        tl.fromTo(['.node-1', '.node-2', '.node-3', '.node-4', '.node-5'],
          { opacity: 0, scale: 0.5 },
          { opacity: 1, scale: 1, duration: 0.8, ease: 'back.out(1.4)', stagger: 0.2 },
          2.0
        );

        // Connections appear
        tl.to('.connections', { opacity: 1, duration: 0.5 }, 2.5);
        tl.to('.conn', { opacity: 1, duration: 0.8, stagger: 0.15 }, 2.5);

        // Node glow pulse
        tl.to('.node-glow', {
          opacity: 0.6,
          scale: 1.3,
          duration: 1.5,
          ease: 'sine.inOut',
          yoyo: true,
          repeat: 2
        }, 3.0);

        // Detail text appears
        tl.fromTo('#graphDetail',
          { opacity: 0, x: 50 },
          { opacity: 1, x: 0, duration: 1.0, ease: 'power3.out' },
          4.0
        );

        // Fade out at end
        tl.to('.text-overlay, .graph-viz', {
          opacity: 0,
          duration: 0.5,
          ease: 'power2.in'
        }, 11.5);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene-graph"] = tl;
      })();
    </script>
  </div>
</template>
