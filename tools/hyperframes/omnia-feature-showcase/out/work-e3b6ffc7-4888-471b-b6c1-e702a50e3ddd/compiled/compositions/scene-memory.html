<template id="scene-memory-template">
  <div data-composition-id="scene-memory" data-width="1920" data-height="1080" data-duration="12">

    <!-- Background -->
    <div class="bg-layer"></div>

    <!-- Memory nodes visualization -->
    <div class="memory-viz">
      <div class="node node-1">
        <div class="node-glow"></div>
        <span>记忆 1</span>
      </div>
      <div class="node node-2">
        <div class="node-glow"></div>
        <span>记忆 2</span>
      </div>
      <div class="node node-3">
        <div class="node-glow"></div>
        <span>记忆 3</span>
      </div>
      <div class="node node-4">
        <div class="node-glow"></div>
        <span>记忆 4</span>
      </div>
      <div class="connection conn-1"></div>
      <div class="connection conn-2"></div>
      <div class="connection conn-3"></div>
    </div>

    <!-- Text overlay -->
    <div class="text-overlay">
      <div class="section-title" id="memoryTitle">记忆宫殿</div>
      <div class="section-desc" id="memoryDesc">记住你说过的每一句话</div>
      <div class="memory-stats">
        <div class="stat">
          <div class="stat-number" id="factCount">190</div>
          <div class="stat-label">事实</div>
        </div>
        <div class="stat">
          <div class="stat-number" id="relCount">51</div>
          <div class="stat-label">关系</div>
        </div>
        <div class="stat">
          <div class="stat-number" id="timelineCount">1904</div>
          <div class="stat-label">时间线</div>
        </div>
      </div>
    </div>

    <style>
      @import url('../assets/fonts/fonts.css');

      [data-composition-id="scene-memory"] {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Inter', 'Noto Sans SC', sans-serif;
      }

      .bg-layer {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(13, 17, 23, 1) 0%, rgba(5, 5, 15, 1) 100%);
      }

      .memory-viz {
        position: absolute;
        left: 100px;
        top: 50%;
        transform: translateY(-50%);
        width: 600px;
        height: 400px;
      }

      .node {
        position: absolute;
        width: 100px;
        height: 100px;
        background: rgba(0, 212, 255, 0.1);
        border: 1px solid rgba(0, 212, 255, 0.3);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        color: rgba(255, 255, 255, 0.8);
        opacity: 0;
      }

      .node-glow {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        background: rgba(0, 212, 255, 0.1);
        opacity: 0;
      }

      .node-1 { top: 50px; left: 100px; }
      .node-2 { top: 50px; left: 350px; }
      .node-3 { top: 200px; left: 200px; }
      .node-4 { top: 200px; left: 450px; }

      .connection {
        position: absolute;
        height: 2px;
        background: linear-gradient(90deg, rgba(0, 212, 255, 0.5), rgba(139, 92, 246, 0.5));
        opacity: 0;
        transform-origin: left center;
      }

      .conn-1 {
        top: 100px;
        left: 150px;
        width: 200px;
      }

      .conn-2 {
        top: 150px;
        left: 250px;
        width: 150px;
        transform: rotate(45deg);
      }

      .conn-3 {
        top: 250px;
        left: 300px;
        width: 150px;
      }

      .text-overlay {
        position: absolute;
        right: 100px;
        top: 50%;
        transform: translateY(-50%);
        text-align: right;
      }

      .section-title {
        font-size: 72px;
        font-weight: 900;
        background: linear-gradient(135deg, #00d4ff 0%, #8b5cf6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        opacity: 0;
      }

      .section-desc {
        font-size: 32px;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.7);
        margin-top: 24px;
        opacity: 0;
      }

      .memory-stats {
        display: flex;
        gap: 48px;
        margin-top: 48px;
        justify-content: flex-end;
      }

      .stat {
        text-align: center;
        opacity: 0;
      }

      .stat-number {
        font-size: 48px;
        font-weight: 900;
        color: #00d4ff;
      }

      .stat-label {
        font-size: 18px;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.5);
        margin-top: 8px;
      }
    </style>

    <script>
      (function() {
        const tl = gsap.timeline({ paused: true });

        // Title appears
        tl.fromTo('#memoryTitle',
          { opacity: 0, x: 50 },
          { opacity: 1, x: 0, duration: 1.0, ease: 'power3.out' },
          0.5
        );

        // Description appears
        tl.fromTo('#memoryDesc',
          { opacity: 0, x: 50 },
          { opacity: 1, x: 0, duration: 1.0, ease: 'power3.out' },
          1.0
        );

        // Nodes appear one by one
        tl.fromTo('.node',
          { opacity: 0, scale: 0.5 },
          { opacity: 1, scale: 1, duration: 0.8, ease: 'back.out(1.4)', stagger: 0.3 },
          1.5
        );

        // Node glow pulse
        tl.to('.node-glow', {
          opacity: 0.5,
          scale: 1.2,
          duration: 1.5,
          ease: 'sine.inOut',
          yoyo: true,
          repeat: 2
        }, 2.0);

        // Connections appear
        tl.to('.connection', {
          opacity: 1,
          duration: 1.0,
          ease: 'power2.out',
          stagger: 0.2
        }, 2.5);

        // Stats appear
        tl.fromTo('.stat',
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out', stagger: 0.2 },
          3.5
        );

        // Fade out at end
        tl.to('.text-overlay, .memory-viz', {
          opacity: 0,
          duration: 0.5,
          ease: 'power2.in'
        }, 11.5);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene-memory"] = tl;
      })();
    </script>
  </div>
</template>
