<template id="scene-tools-template">
  <div data-composition-id="scene-tools" data-width="1920" data-height="1080" data-duration="12">

    <!-- Background -->
    <div class="bg-layer"></div>

    <!-- Tools grid -->
    <div class="tools-grid">
      <div class="tool-card">
        <div class="tool-icon">📁</div>
        <div class="tool-name">读文件</div>
        <div class="tool-desc">read_file</div>
      </div>
      <div class="tool-card">
        <div class="tool-icon">💻</div>
        <div class="tool-name">执行代码</div>
        <div class="tool-desc">execute_shell</div>
      </div>
      <div class="tool-card">
        <div class="tool-icon">🔍</div>
        <div class="tool-name">搜索</div>
        <div class="tool-desc">web_search</div>
      </div>
      <div class="tool-card">
        <div class="tool-icon">💾</div>
        <div class="tool-name">数据库</div>
        <div class="tool-desc">query_database</div>
      </div>
      <div class="tool-card">
        <div class="tool-icon">📧</div>
        <div class="tool-name">发邮件</div>
        <div class="tool-desc">send_email</div>
      </div>
      <div class="tool-card">
        <div class="tool-icon">🔔</div>
        <div class="tool-name">通知</div>
        <div class="tool-desc">send_notification</div>
      </div>
    </div>

    <!-- Text overlay -->
    <div class="text-overlay">
      <div class="section-title" id="toolsTitle">工具调用</div>
      <div class="section-desc" id="toolsDesc">一句话，帮你干完一整天的活</div>
      <div class="section-detail" id="toolsDetail">
        40+ 种工具能力<br/>
        从读文件到发通知
      </div>
    </div>

    <style>
      @import url('../assets/fonts/fonts.css');

      [data-composition-id="scene-tools"] {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Inter', 'Noto Sans SC', sans-serif;
      }

      .bg-layer {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(13, 17, 23, 1) 0%, rgba(5, 5, 15, 1) 100%);
      }

      .tools-grid {
        position: absolute;
        left: 100px;
        top: 50%;
        transform: translateY(-50%);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
        width: 500px;
      }

      .tool-card {
        background: rgba(0, 212, 255, 0.05);
        border: 1px solid rgba(0, 212, 255, 0.2);
        border-radius: 16px;
        padding: 24px;
        text-align: center;
        opacity: 0;
      }

      .tool-icon {
        font-size: 48px;
        margin-bottom: 12px;
      }

      .tool-name {
        font-size: 18px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.9);
        margin-bottom: 8px;
      }

      .tool-desc {
        font-size: 14px;
        font-weight: 300;
        color: rgba(0, 212, 255, 0.6);
        font-family: monospace;
      }

      .text-overlay {
        position: absolute;
        right: 100px;
        top: 50%;
        transform: translateY(-50%);
        text-align: right;
      }

      .section-title {
        font-size: 72px;
        font-weight: 900;
        background: linear-gradient(135deg, #00d4ff 0%, #8b5cf6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        opacity: 0;
      }

      .section-desc {
        font-size: 32px;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.7);
        margin-top: 24px;
        opacity: 0;
      }

      .section-detail {
        font-size: 24px;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.5);
        margin-top: 32px;
        line-height: 1.6;
        opacity: 0;
      }
    </style>

    <script>
      (function() {
        const tl = gsap.timeline({ paused: true });

        // Title appears
        tl.fromTo('#toolsTitle',
          { opacity: 0, x: 50 },
          { opacity: 1, x: 0, duration: 1.0, ease: 'power3.out' },
          0.5
        );

        // Description appears
        tl.fromTo('#toolsDesc',
          { opacity: 0, x: 50 },
          { opacity: 1, x: 0, duration: 1.0, ease: 'power3.out' },
          1.0
        );

        // Tool cards appear one by one
        tl.fromTo('.tool-card',
          { opacity: 0, y: 30, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: 'back.out(1.4)', stagger: 0.2 },
          1.5
        );

        // Detail text appears
        tl.fromTo('#toolsDetail',
          { opacity: 0, x: 50 },
          { opacity: 1, x: 0, duration: 1.0, ease: 'power3.out' },
          3.5
        );

        // Fade out at end
        tl.to('.text-overlay, .tools-grid', {
          opacity: 0,
          duration: 0.5,
          ease: 'power2.in'
        }, 11.5);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene-tools"] = tl;
      })();
    </script>
  </div>
</template>
