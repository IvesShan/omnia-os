<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>无人机维修服务 - 抖音短视频</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body, html {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: 'Noto Sans SC', sans-serif;
        background: #0a0a0a;
      }

      #main-composition {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: linear-gradient(180deg, #0a1628 0%, #0d2137 40%, #0a1628 100%);
      }

      /* 星点粒子背景 */
      .stars {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      .star {
        position: absolute;
        width: 3px;
        height: 3px;
        background: #fff;
        border-radius: 50%;
        opacity: 0.3;
      }

      /* 主内容区 */
      .content {
        position: absolute;
        z-index: 10;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* 标题区 */
      .hero-title {
        font-size: 96px;
        font-weight: 900;
        color: #00d4ff;
        text-align: center;
        text-shadow: 0 0 40px rgba(0, 212, 255, 0.5);
        line-height: 1.2;
      }

      .hero-subtitle {
        font-size: 48px;
        font-weight: 400;
        color: #ffffff;
        text-align: center;
        margin-top: 30px;
      }

      /* 服务项目卡片 */
      .services {
        margin-top: 100px;
        width: 90%;
        display: flex;
        flex-direction: column;
        gap: 30px;
      }

      .service-card {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 212, 255, 0.3);
        border-radius: 20px;
        padding: 40px 50px;
        display: flex;
        align-items: center;
        gap: 30px;
      }

      .service-icon {
        font-size: 64px;
        flex-shrink: 0;
      }

      .service-text h3 {
        font-size: 40px;
        font-weight: 700;
        color: #00d4ff;
      }

      .service-text p {
        font-size: 28px;
        color: rgba(255, 255, 255, 0.7);
        margin-top: 8px;
      }

      /* 价格标签 */
      .price-section {
        margin-top: 80px;
        text-align: center;
      }

      .price-label {
        font-size: 36px;
        color: rgba(255, 255, 255, 0.6);
      }

      .price-value {
        font-size: 120px;
        font-weight: 900;
        color: #ff6b35;
        text-shadow: 0 0 30px rgba(255, 107, 53, 0.5);
        line-height: 1.1;
      }

      .price-unit {
        font-size: 40px;
        color: rgba(255, 255, 255, 0.5);
      }

      /* CTA 按钮 */
      .cta {
        margin-top: 60px;
        background: linear-gradient(135deg, #00d4ff, #0088ff);
        padding: 30px 80px;
        border-radius: 60px;
      }

      .cta-text {
        font-size: 44px;
        font-weight: 700;
        color: #fff;
        text-align: center;
      }

      /* 底部信息 */
      .footer {
        position: absolute;
        bottom: 100px;
        width: 100%;
        text-align: center;
      }

      .footer-text {
        font-size: 30px;
        color: rgba(255, 255, 255, 0.5);
      }

      /* 呼吸光效 */
      .glow-ring {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        border: 2px solid rgba(0, 212, 255, 0.2);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div id="main-composition"
         data-composition-id="drone-repair"
         data-width="1080"
         data-height="1920"
         data-start="0"
         data-duration="20">

      <!-- 背景粒子 -->
      <div class="stars" data-composition-id="stars" data-start="0" data-duration="20">
        <div class="star" style="left:10%;top:5%"></div>
        <div class="star" style="left:25%;top:15%"></div>
        <div class="star" style="left:45%;top:8%"></div>
        <div class="star" style="left:70%;top:12%"></div>
        <div class="star" style="left:85%;top:6%"></div>
        <div class="star" style="left:15%;top:25%"></div>
        <div class="star" style="left:55%;top:20%"></div>
        <div class="star" style="left:90%;top:22%"></div>
        <div class="star" style="left:35%;top:30%"></div>
        <div class="star" style="left:75%;top:28%"></div>
      </div>

      <!-- 光环 -->
      <div class="glow-ring"></div>

      <!-- 主内容 -->
      <div class="content">
        <div class="hero-title">✈️ 无人机维修</div>
        <div class="hero-subtitle">专业 · 快速 · 可靠</div>

        <div class="services">
          <div class="service-card">
            <div class="service-icon">🔧</div>
            <div class="service-text">
              <h3>云台校准</h3>
              <p>大疆全系列云台精校</p>
            </div>
          </div>
          <div class="service-card">
            <div class="service-icon">🔋</div>
            <div class="service-text">
              <h3>电池维修</h3>
              <p>电池修复/更换/保养</p>
            </div>
          </div>
          <div class="service-card">
            <div class="service-icon">🛩️</div>
            <div class="service-text">
              <h3>桨叶/机架更换</h3>
              <p>摔机维修 原厂配件</p>
            </div>
          </div>
          <div class="service-card">
            <div class="service-icon">📡</div>
            <div class="service-text">
              <h3>信号模块修复</h3>
              <p>图传/遥控/天线维修</p>
            </div>
          </div>
        </div>

        <div class="price-section">
          <div class="price-label">维修起步价</div>
          <div class="price-value">¥99</div>
          <div class="price-unit">起 / 24小时出</div>
        </div>

        <div class="cta">
          <div class="cta-text">💬 私信咨询 · 免费检测</div>
        </div>

        <div class="footer">
          <div class="footer-text">📍 全国寄修 · 顺丰包邮 · 质保90天</div>
        </div>
      </div>

      <script>
        const totalDuration = 20;
        const tl = gsap.timeline({ paused: true });

        // 初始状态 - 使用 GSAP set 而非 CSS transform
        gsap.set('.hero-title', { scale: 0.5, opacity: 0 });
        gsap.set('.hero-subtitle', { y: 50, opacity: 0 });
        gsap.set('.service-card', { x: -100, opacity: 0 });
        gsap.set('.price-section', { scale: 0, opacity: 0 });
        gsap.set('.cta', { y: 50, opacity: 0 });
        gsap.set('.footer', { opacity: 0 });
        gsap.set('.glow-ring', { opacity: 0 });

        // 0-0.5s: 星星闪烁 (有限重复)
        tl.to('.star', {
          opacity: 0.9,
          stagger: { each: 0.05 },
          duration: 0.3,
          ease: 'power1.inOut'
        }, 0);

        // 1-2s: 标题弹入
        tl.to('.hero-title', {
          opacity: 1, scale: 1,
          duration: 0.8,
          ease: 'back.out(1.7)'
        }, 1);

        // 2-3s: 副标题淡入
        tl.to('.hero-subtitle', {
          opacity: 1, y: 0,
          duration: 0.6,
          ease: 'power2.out'
        }, 2);

        // 2.5-4.5s: 光环呼吸 (有限重复)
        const glowRepeat = Math.floor(totalDuration / 2) - 1;
        tl.to('.glow-ring', {
          opacity: 0.6,
          scale: 1.5,
          duration: 1,
          ease: 'sine.inOut',
          repeat: glowRepeat,
          yoyo: true
        }, 2.5);

        // 4-7s: 服务卡片逐个滑入
        tl.to('.service-card', {
          opacity: 1, x: 0,
          duration: 0.5,
          stagger: 0.6,
          ease: 'power2.out'
        }, 4);

        // 11-12s: 价格弹入
        tl.to('.price-section', {
          opacity: 1, scale: 1,
          duration: 0.6,
          ease: 'back.out(2)'
        }, 11);

        // 13-14s: CTA 滑入
        tl.to('.cta', {
          opacity: 1, y: 0,
          duration: 0.5,
          ease: 'power2.out'
        }, 13);

        // 15-16s: 底部信息
        tl.to('.footer', {
          opacity: 1,
          duration: 0.5
        }, 15);

        window.__timelines = window.__timelines || {};
        window.__timelines['drone-repair'] = tl;
      </script>
    </div>
  </body>
</html>
