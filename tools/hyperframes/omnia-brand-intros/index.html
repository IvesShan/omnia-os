<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OMNIA Brand Intro - Hyperframes</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&family=Inter:wght@300;400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body, html {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #main-composition {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .comp-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="main-composition"
      data-composition-id="main-video"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="4"
    >
      <!-- Intro Composition -->
      <div
        id="intro-layer"
        class="comp-layer"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
      ></div>

      <script>
        const mainTl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["main-video"] = mainTl;
      </script>
    </div>
  </body>
</html>
