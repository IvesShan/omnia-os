<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Reveal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 720px;
  height: 1280px;
  overflow: hidden;
  background: #050508;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Sans SC', sans-serif;
}

#canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}

.content {
  position: relative;
  z-index: 10;
  text-align: center;
  opacity: 0;
  animation: contentReveal 2s ease forwards;
  animation-delay: 1.5s;
}

@keyframes contentReveal {
  from { opacity: 0; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1); }
}

.main-title {
  font-size: 96px;
  font-weight: 900;
  color: #fff;
  letter-spacing: 24px;
  text-shadow: 
    0 0 40px rgba(100, 200, 255, 0.5),
    0 0 80px rgba(100, 200, 255, 0.3);
  background: linear-gradient(180deg, #fff 0%, #a0d8ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.sub-title {
  margin-top: 30px;
  font-size: 28px;
  color: rgba(160, 216, 255, 0.8);
  letter-spacing: 16px;
}

/* 底部光线 */
.light-beam {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 2px;
  height: 300px;
  background: linear-gradient(to top, rgba(100,200,255,0.6), transparent);
  opacity: 0;
  animation: beamUp 2s ease forwards;
  animation-delay: 1s;
}

@keyframes beamUp {
  from { opacity: 0; height: 0; }
  to { opacity: 1; height: 300px; }
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="light-beam"></div>

<div class="content">
  <div class="main-title">OMNIA</div>
  <div class="sub-title">智能 · 高效 · 无界</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = 720;
canvas.height = 1280;

const particles = [];
const particleCount = 120;

class Particle {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2 + 0.5;
    this.speedX = (Math.random() - 0.5) * 0.5;
    this.speedY = (Math.random() - 0.5) * 0.5;
    this.opacity = Math.random() * 0.5 + 0.2;
    this.color = Math.random() > 0.5 ? '100, 200, 255' : '200, 100, 255';
  }

  update() {
    this.x += this.speedX;
    this.y += this.speedY;

    if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
    if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${this.color}, ${this.opacity})`;
    ctx.fill();
  }
}

// 初始化粒子
for (let i = 0; i < particleCount; i++) {
  particles.push(new Particle());
}

// 连线
function drawLines() {
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < 100) {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(100, 200, 255, ${0.1 * (1 - distance / 100)})`;
        ctx.lineWidth = 0.5;
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }
  }
}

function animate() {
  ctx.fillStyle = 'rgba(5, 5, 8, 0.1)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  particles.forEach(p => {
    p.update();
    p.draw();
  });

  drawLines();
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
