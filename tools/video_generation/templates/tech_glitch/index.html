<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Glitch Intro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@400;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a0f;
  overflow: hidden;
  width: 720px;
  height: 1280px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Sans SC', sans-serif;
}

/* 网格背景 */
.grid-bg {
  position: absolute;
  width: 100%; height: 100%;
  background-image: 
    linear-gradient(rgba(0,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.03) 1px, transparent 1px);
  background-size: 50px 50px;
  animation: gridMove 20s linear infinite;
}
@keyframes gridMove {
  0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
  100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
}

/* 扫描线 */
.scanline {
  position: absolute;
  width: 100%; height: 4px;
  background: rgba(0,255,255,0.1);
  animation: scan 3s linear infinite;
}
@keyframes scan {
  0% { top: -4px; }
  100% { top: 100%; }
}

.container {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 40px;
}

/* Glitch 主文字 */
.glitch-text {
  font-size: 72px;
  font-weight: 900;
  color: #fff;
  position: relative;
  display: inline-block;
  letter-spacing: 8px;
  text-transform: uppercase;
}

.glitch-text::before,
.glitch-text::after {
  content: attr(data-text);
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}

.glitch-text::before {
  color: #ff0040;
  animation: glitch-1 0.3s infinite linear alternate-reverse;
  clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
}

.glitch-text::after {
  color: #00ffff;
  animation: glitch-2 0.3s infinite linear alternate-reverse;
  clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
}

@keyframes glitch-1 {
  0% { transform: translate(0); }
  20% { transform: translate(-3px, 3px); }
  40% { transform: translate(-3px, -3px); }
  60% { transform: translate(3px, 3px); }
  80% { transform: translate(3px, -3px); }
  100% { transform: translate(0); }
}

@keyframes glitch-2 {
  0% { transform: translate(0); }
  20% { transform: translate(3px, -3px); }
  40% { transform: translate(3px, 3px); }
  60% { transform: translate(-3px, -3px); }
  80% { transform: translate(-3px, 3px); }
  100% { transform: translate(0); }
}

/* 副标题 */
.subtitle {
  margin-top: 40px;
  font-size: 32px;
  color: rgba(255,255,255,0.6);
  letter-spacing: 12px;
  opacity: 0;
  animation: fadeInUp 0.8s ease forwards;
  animation-delay: 1.2s;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 装饰线 */
.decor-line {
  width: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, #00ffff, transparent);
  margin: 30px auto;
  animation: lineExpand 1s ease forwards;
  animation-delay: 0.5s;
}

@keyframes lineExpand {
  to { width: 300px; }
}

/* 闪烁光标 */
.cursor {
  display: inline-block;
  width: 3px;
  height: 1em;
  background: #00ffff;
  margin-left: 8px;
  animation: blink 0.8s infinite;
  vertical-align: middle;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="scanline"></div>

<div class="container">
  <div class="glitch-text" data-text="OMNIA">OMNIA</div>
  <div class="decor-line"></div>
  <div class="subtitle">你的 AI 超级助手<span class="cursor"></span></div>
</div>

<script>
// 随机故障效果增强
document.querySelector('.glitch-text').addEventListener('animationiteration', function() {
  if (Math.random() > 0.7) {
    this.style.transform = `translate(${Math.random()*6-3}px, ${Math.random()*6-3}px)`;
    setTimeout(() => { this.style.transform = ''; }, 100);
  }
});
</script>
</body>
</html>
