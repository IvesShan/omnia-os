name: Build Omnia - All Platforms (FastAPI)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyarmor nuitka ordered-set zstandard
          pip install fastapi uvicorn[standard] python-multipart
          pip install pydantic pydantic-settings pyyaml
          pip install httpx aiofiles requests psutil
          pip install python-jose passlib bcrypt
          pip install jinja2
      
      - name: Test Import
        run: |
          python -c "from src.omnia.main import app; print('FastAPI app imported successfully!')"
      
      - name: Obfuscate with PyArmor
        run: |
          pyarmor gen -O dist/obfuscated -r src/
      
      - name: Build with Nuitka
        run: |
          python -m nuitka --standalone --onefile `
            --output-dir=dist/nuitka-build `
            --output-filename=omnia-backend.exe `
            --include-data-dir=seeds;seeds `
            --include-data-dir=config;config `
            --include-data-dir=web;web `
            --include-package=fastapi `
            --include-package=uvicorn `
            --include-package=uvicorn.logging `
            --include-package=uvicorn.loops `
            --include-package=uvicorn.loops.auto `
            --include-package=uvicorn.protocols `
            --include-package=uvicorn.protocols.http `
            --include-package=uvicorn.protocols.http.auto `
            --include-package=uvicorn.protocols.websockets `
            --include-package=uvicorn.protocols.websockets.auto `
            --include-package=uvicorn.lifespan `
            --include-package=uvicorn.lifespan.on `
            --include-package=starlette `
            --include-package=starlette.responses `
            --include-package=starlette.routing `
            --include-package=starlette.middleware `
            --include-package=starlette.middleware.cors `
            --include-package=starlette.staticfiles `
            --include-package=starlette.templating `
            --include-package=pydantic `
            --include-package=pydantic_settings `
            --include-package=yaml `
            --include-package=httpx `
            --include-package=aiofiles `
            --include-package=multipart `
            --include-package=psutil `
            --include-package=sqlite3 `
            --include-package=email.mime `
            --include-package=json `
            --include-package=jose `
            --include-package=passlib `
            --include-package=bcrypt `
            --include-package=jinja2 `
            --include-package=src `
            --include-package=src.omnia `
            --include-package=src.omnia.routers `
            --include-package=src.omnia.services `
            --include-package=src.core `
            --include-package=src.core.actuator `
            --no-progressbar `
            --assume-yes-for-downloads `
            src/omnia/standalone_main.py
      
      - name: Verify Binary
        run: |
          $binary = Get-ChildItem -Path dist/nuitka-build -Filter "omnia-backend.exe" -Recurse | Select-Object -First 1
          if (-not $binary) {
            Write-Error "❌ Binary not found!"
            Get-ChildItem -Path dist/nuitka-build -Recurse | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "✅ Binary found: $($binary.FullName)"
          Write-Host "   Size: $([math]::Round($binary.Length / 1MB, 2)) MB"
      
      - name: Find and Package Binary
        run: |
          mkdir -p dist/package
          $binary = Get-ChildItem -Path dist/nuitka-build -Filter "omnia-backend.exe" -Recurse | Select-Object -First 1
          if ($binary) {
            Copy-Item $binary.FullName dist/package/
          } else {
            Write-Error "Binary not found!"
            exit 1
          }
          Copy-Item -Recurse seeds dist/package/
          Copy-Item -Recurse config dist/package/
          Copy-Item -Recurse web dist/package/
          New-Item -ItemType Directory -Path dist/package/tools -Force
          Copy-Item tools/license_system.py dist/package/tools/
          Copy-Item tools/keygen.py dist/package/tools/
          Copy-Item LICENSE.txt dist/package/ -ErrorAction SilentlyContinue
          Copy-Item README.md dist/package/ -ErrorAction SilentlyContinue
          
          "@echo off" | Out-File -FilePath dist/package/start-omnia.bat -Encoding ASCII
          "cd /d `"%~dp0`"" | Out-File -FilePath dist/package/start-omnia.bat -Append -Encoding ASCII
          "echo." | Out-File -FilePath dist/package/start-omnia.bat -Append -Encoding ASCII
          "echo  =========================================" | Out-File -FilePath dist/package/start-omnia.bat -Append -Encoding ASCII
          "echo   Omnia AIOS v2.0.3 (FastAPI)" | Out-File -FilePath dist/package/start-omnia.bat -Append -Encoding ASCII
          "echo  =========================================" | Out-File -FilePath dist/package/start-omnia.bat -Append -Encoding ASCII
          "echo   Starting server..." | Out-File -FilePath dist/package/start-omnia.bat -Append -Encoding ASCII
          "echo   Open http://127.0.0.1:8765/license to activate" | Out-File -FilePath dist/package/start-omnia.bat -Append -Encoding ASCII
          "echo  =========================================" | Out-File -FilePath dist/package/start-omnia.bat -Append -Encoding ASCII
          "echo." | Out-File -FilePath dist/package/start-omnia.bat -Append -Encoding ASCII
          "omnia-backend.exe --port 8765" | Out-File -FilePath dist/package/start-omnia.bat -Append -Encoding ASCII
          "pause" | Out-File -FilePath dist/package/start-omnia.bat -Append -Encoding ASCII
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnia-windows
          path: dist/package/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyarmor nuitka ordered-set zstandard
          pip install fastapi uvicorn[standard] python-multipart
          pip install pydantic pydantic-settings pyyaml
          pip install httpx aiofiles requests psutil
          pip install python-jose passlib bcrypt
          pip install jinja2
      
      - name: Test Import
        run: |
          python -c "from src.omnia.main import app; print('FastAPI app imported successfully!')"
      
      - name: Obfuscate with PyArmor
        run: |
          pyarmor gen -O dist/obfuscated -r src/
      
      - name: Build with Nuitka
        run: |
          python -m nuitka --standalone --onefile \
            --output-dir=dist/nuitka-build \
            --output-filename=omnia-backend \
            --include-data-dir=seeds=seeds \
            --include-data-dir=config=config \
            --include-data-dir=web=web \
            --include-package=fastapi \
            --include-package=uvicorn \
            --include-package=uvicorn.logging \
            --include-package=uvicorn.loops \
            --include-package=uvicorn.loops.auto \
            --include-package=uvicorn.protocols \
            --include-package=uvicorn.protocols.http \
            --include-package=uvicorn.protocols.http.auto \
            --include-package=uvicorn.protocols.websockets \
            --include-package=uvicorn.protocols.websockets.auto \
            --include-package=uvicorn.lifespan \
            --include-package=uvicorn.lifespan.on \
            --include-package=starlette \
            --include-package=starlette.responses \
            --include-package=starlette.routing \
            --include-package=starlette.middleware \
            --include-package=starlette.middleware.cors \
            --include-package=starlette.staticfiles \
            --include-package=starlette.templating \
            --include-package=pydantic \
            --include-package=pydantic_settings \
            --include-package=yaml \
            --include-package=httpx \
            --include-package=aiofiles \
            --include-package=multipart \
            --include-package=psutil \
            --include-package=sqlite3 \
            --include-package=email.mime \
            --include-package=json \
            --include-package=jose \
            --include-package=passlib \
            --include-package=bcrypt \
            --include-package=jinja2 \
            --include-package=src \
            --include-package=src.omnia \
            --include-package=src.omnia.routers \
            --include-package=src.omnia.services \
            --include-package=src.core \
            --include-package=src.core.actuator \
            --no-progressbar \
            --assume-yes-for-downloads \
            --macos-create-app-bundle \
            src/omnia/standalone_main.py
      
      - name: Find and Package Binary
        run: |
          mkdir -p dist/package
          BINARY=$(find dist/nuitka-build -name "omnia-backend" -type f | head -1)
          if [ -z "$BINARY" ]; then
            echo "Error: Binary not found!"
            find dist/nuitka-build -type f
            exit 1
          fi
          cp "$BINARY" dist/package/
          chmod +x dist/package/omnia-backend
          cp -r seeds dist/package/
          cp -r config dist/package/
          cp -r web dist/package/
          mkdir -p dist/package/tools
          cp tools/license_system.py dist/package/tools/
          cp tools/keygen.py dist/package/tools/
          cp LICENSE.txt dist/package/ 2>/dev/null || true
          cp README.md dist/package/ 2>/dev/null || true
          
          cat > dist/package/start-omnia.sh << 'LAUNCHER'
          #!/bin/bash
          echo "========================================="
          echo "  Omnia AIOS v2.0.3 (FastAPI)"
          echo "========================================="
          echo "  Starting server..."
          echo "  Open http://127.0.0.1:8765/license to activate"
          echo "========================================="
          cd "$(dirname "$0")"
          ./omnia-backend --port 8765
          LAUNCHER
          chmod +x dist/package/start-omnia.sh
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnia-macos
          path: dist/package/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyarmor nuitka ordered-set zstandard
          pip install fastapi uvicorn[standard] python-multipart
          pip install pydantic pydantic-settings pyyaml
          pip install httpx aiofiles requests psutil
          pip install python-jose passlib bcrypt
          pip install jinja2
      
      - name: Test Import
        run: |
          python -c "from src.omnia.main import app; print('FastAPI app imported successfully!')"
      
      - name: Obfuscate with PyArmor
        run: |
          pyarmor gen -O dist/obfuscated -r src/
      
      - name: Build with Nuitka
        run: |
          python -m nuitka --standalone --onefile \
