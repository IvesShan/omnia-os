name: Test Import Fix

on:
  workflow_dispatch:

jobs:
  test-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn[standard] python-multipart
          pip install pydantic pydantic-settings pyyaml
          pip install httpx aiofiles requests psutil
          pip install python-jose passlib bcrypt
          pip install jieba
          echo "✅ Dependencies installed"
      
      - name: Debug Python Path
        run: |
          python -c "import sys; print('Python path:'); [print(f'  {p}') for p in sys.path]"
          python -c "import os; print('CWD:', os.getcwd()); print('Files:', os.listdir('.'))"
      
      - name: Test Basic Imports
        run: |
          python -c "import fastapi; print('✅ fastapi:', fastapi.__version__)"
          python -c "import uvicorn; print('✅ uvicorn:', uvicorn.__version__)"
          python -c "import pydantic; print('✅ pydantic:', pydantic.__version__)"
          python -c "import pydantic_settings; print('✅ pydantic_settings')"
          python -c "import yaml; print('✅ yaml')"
          python -c "import httpx; print('✅ httpx')"
          python -c "import aiofiles; print('✅ aiofiles')"
          python -c "import multipart; print('✅ multipart')"
          python -c "import psutil; print('✅ psutil')"
          python -c "import jose; print('✅ jose')"
          python -c "import passlib; print('✅ passlib')"
          python -c "import bcrypt; print('✅ bcrypt')"
      
      - name: Test Core Imports
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          try:
              from src.core import Tool, ToolRegistry
              print('✅ src.core imported')
          except Exception as e:
              print(f'❌ src.core failed: {e}')
              import traceback
              traceback.print_exc()
          "
      
      - name: Test Config Import
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          try:
              from src.omnia.config import settings
              print('✅ config imported, project_root:', settings.project_root)
          except Exception as e:
              print(f'❌ config failed: {e}')
              import traceback
              traceback.print_exc()
          "
      
      - name: Test Main Import
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          try:
              from src.omnia.main import app
              print('✅ main imported, app:', app.title)
          except Exception as e:
              print(f'❌ main failed: {e}')
              import traceback
              traceback.print_exc()
          "
