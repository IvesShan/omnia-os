name: Build Python Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-wheel:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build

      - name: Build package (wheel + sdist)
        run: python -m build

      - name: Inspect built artifacts
        run: |
          ls -lh dist/
          python -m tarfile -l dist/*.tar.gz | head -20 || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnia-dist
          path: dist/
          retention-days: 30

  test-install:
    name: Test pip install on ${{ matrix.os }} (Python ${{ matrix.python }})
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: omnia-dist
          path: dist/

      - name: Install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Verify omnia CLI works
        shell: bash
        run: |
          omnia --help
          omnia doctor --help || true

  # 发布到 PyPI：仅当打 tag v*.*.* 时触发，需要配置 Trusted Publishing
  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheel, test-install]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/omnia-ai
    permissions:
      id-token: write  # 用于 PyPI Trusted Publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: omnia-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
