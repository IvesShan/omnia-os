<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喵修盾 黑金版</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0a;
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}
.poster {
  width: 600px;
  background: #0a0a0a;
  border: 1px solid #333;
  position: relative;
  overflow: hidden;
}
/* SVG装饰区 */
.geo-area {
  position: relative;
  height: 280px;
  background: #0a0a0a;
  border-bottom: 1px solid #d4af37;
}
.svg-deco {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}
/* 标题 */
.brand-tag {
  position: absolute;
  top: 24px; left: 24px;
  font-size: 11px;
  color: #d4af37;
  letter-spacing: 4px;
  text-transform: uppercase;
  border: 1px solid #d4af37;
  padding: 4px 12px;
  background: #0a0a0a;
}
.main-title {
  position: absolute;
  bottom: 40px; left: 24px;
  font-size: 52px;
  font-weight: 900;
  color: #fff;
  line-height: 1.1;
  letter-spacing: -2px;
}
.main-title span {
  color: #d4af37;
  font-size: 24px;
  display: block;
  margin-top: 8px;
  letter-spacing: 8px;
  font-weight: 400;
}
/* 内容 */
.content {
  padding: 32px 24px;
}
.pain-block {
  border-left: 3px solid #d4af37;
  padding-left: 16px;
  margin-bottom: 32px;
}
.pain-block h3 {
  font-size: 15px;
  color: #fff;
  font-weight: 700;
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.pain-block p {
  font-size: 13px;
  color: #888;
  line-height: 1.8;
}
/* 三档 */
.grid-header {
  display: flex;
  border-bottom: 1px solid #333;
  padding-bottom: 8px;
  margin-bottom: 16px;
}
.grid-header div {
  flex: 1;
  font-size: 11px;
  color: #666;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.grid-header div:nth-child(2) { text-align: center; }
.grid-header div:nth-child(3) { text-align: center; color: #d4af37; }
.grid-header div:nth-child(4) { text-align: right; }

.row {
  display: flex;
  align-items: baseline;
  padding: 16px 0;
  border-bottom: 1px solid #222;
}
.row .name { flex: 1; font-size: 15px; color: #fff; font-weight: 700; }
.row .price { flex: 1; text-align: center; font-size: 13px; color: #aaa; }
.row .highlight { flex: 1; text-align: center; font-size: 20px; color: #d4af37; font-weight: 900; }
.row .desc { flex: 1; text-align: right; font-size: 12px; color: #666; }

/* CTA */
.cta-zone {
  margin-top: 32px;
  border-top: 1px solid #333;
  padding-top: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.cta-text {
  font-size: 12px;
  color: #666;
  letter-spacing: 1px;
}
.cta-btn {
  background: #d4af37;
  color: #0a0a0a;
  border: none;
  padding: 12px 32px;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 2px;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="poster">
  <div class="geo-area">
    <svg class="svg-deco" viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg">
      <!-- 网格线 -->
      <line x1="0" y1="140" x2="600" y2="140" stroke="#1a1a1a" stroke-width="1"/>
      <line x1="300" y1="0" x2="300" y2="280" stroke="#1a1a1a" stroke-width="1"/>
      <!-- 抽象盾牌 -->
      <polygon points="300,60 360,100 360,180 300,220 240,180 240,100" 
               fill="none" stroke="#d4af37" stroke-width="2"/>
      <!-- 内部几何 -->
      <circle cx="300" cy="140" r="24" fill="none" stroke="#d4af37" stroke-width="1.5"/>
      <line x1="276" y1="140" x2="324" y2="140" stroke="#d4af37" stroke-width="1.5"/>
      <line x1="300" y1="116" x2="300" y2="164" stroke="#d4af37" stroke-width="1.5"/>
      <!-- 装饰方块 -->
      <rect x="80" y="80" width="40" height="40" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.6"/>
      <rect x="480" y="160" width="60" height="60" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.6"/>
      <!-- 斜线 -->
      <line x1="120" y1="240" x2="180" y2="200" stroke="#d4af37" stroke-width="1" opacity="0.4"/>
      <line x1="420" y1="80" x2="480" y2="40" stroke="#d4af37" stroke-width="1" opacity="0.4"/>
      <!-- 点阵 -->
      <circle cx="520" cy="100" r="2" fill="#d4af37" opacity="0.8"/>
      <circle cx="540" cy="100" r="2" fill="#d4af37" opacity="0.8"/>
      <circle cx="520" cy="120" r="2" fill="#d4af37" opacity="0.8"/>
      <circle cx="540" cy="120" r="2" fill="#d4af37" opacity="0.8"/>
    </svg>
    <div class="brand-tag">MAOXIAOJIANG</div>
    <div class="main-title">喵修盾<br><span>维修额度保障</span></div>
  </div>

  <div class="content">
    <div class="pain-block">
      <h3>客户问得最多：坏了怎么办？</h3>
      <p>销售二手无人机或租赁时，无质保则成交率大打折扣。喵修匠将维修能力产品化，为数码店主提供可销售的保障卡。</p>
    </div>

    <div class="grid-header">
      <div>产品</div>
      <div>售价</div>
      <div>维修额度</div>
      <div>折扣</div>
    </div>

    <div class="row">
      <div class="name">基础版</div>
      <div class="price">99元</div>
      <div class="highlight">800</div>
      <div class="desc">7折 / 6个月</div>
    </div>
    <div class="row">
      <div class="name">标准版</div>
      <div class="price">199元</div>
      <div class="highlight">1800</div>
      <div class="desc">6折 / 12个月</div>
    </div>
    <div class="row">
      <div class="name">尊享版</div>
      <div class="price">299元</div>
      <div class="highlight">3000</div>
      <div class="desc">5折 / 12个月</div>
    </div>

    <div class="cta-zone">
      <div class="cta-text">CONTACT FOR PARTNERSHIP</div>
      <div class="cta-btn">立即合作</div>
    </div>
  </div>
</div>
</body>
</html>
