<!DOCTYPE html>
<html>
<head>
    <title>Debug Token</title>
</head>
<body>
    <h1>Token 统计调试</h1>
    <button onclick="clearHistory()">清除聊天历史</button>
    <button onclick="showHistory()">显示聊天历史</button>
    <pre id="output"></pre>
    
    <script>
        const CHAT_KEY = 'omnia_chat_history_v1';
        
        function showHistory() {
            const raw = localStorage.getItem(CHAT_KEY);
            const output = document.getElementById('output');
            if (raw) {
                const parsed = JSON.parse(raw);
                output.textContent = JSON.stringify(parsed, null, 2);
            } else {
                output.textContent = 'No history found';
            }
        }
        
        function clearHistory() {
            localStorage.removeItem(CHAT_KEY);
            document.getElementById('output').textContent = 'History cleared!';
        }
    </script>
</body>
</html>
