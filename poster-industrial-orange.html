<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喵修盾 工业版</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111;
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}
.poster {
  width: 600px;
  background: #111;
  border: 1px solid #333;
  position: relative;
  overflow: hidden;
}
.geo-area {
  position: relative;
  height: 280px;
  background: #111;
  border-bottom: 2px solid #ff6b00;
}
.svg-deco {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}
.brand-tag {
  position: absolute;
  top: 24px; left: 24px;
  font-size: 11px;
  color: #ff6b00;
  letter-spacing: 4px;
  border: 1px solid #ff6b00;
  padding: 4px 12px;
  background: #111;
  font-weight: 700;
}
.main-title {
  position: absolute;
  bottom: 40px; left: 24px;
  font-size: 56px;
  font-weight: 900;
  color: #fff;
  line-height: 1.1;
  letter-spacing: -2px;
}
.main-title span {
  color: #ff6b00;
  font-size: 22px;
  display: block;
  margin-top: 6px;
  letter-spacing: 6px;
  font-weight: 500;
}
.content {
  padding: 32px 24px;
}
.pain-block {
  border-left: 4px solid #ff6b00;
  padding-left: 16px;
  margin-bottom: 32px;
}
.pain-block h3 {
  font-size: 16px;
  color: #fff;
  font-weight: 900;
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.pain-block p {
  font-size: 13px;
  color: #999;
  line-height: 1.8;
}
.grid-header {
  display: flex;
  border-bottom: 1px solid #444;
  padding-bottom: 8px;
  margin-bottom: 16px;
}
.grid-header div {
  flex: 1;
  font-size: 11px;
  color: #666;
  letter-spacing: 2px;
  font-weight: 700;
}
.grid-header div:nth-child(2) { text-align: center; }
.grid-header div:nth-child(3) { text-align: center; color: #ff6b00; }
.grid-header div:nth-child(4) { text-align: right; }

.row {
  display: flex;
  align-items: baseline;
  padding: 16px 0;
  border-bottom: 1px solid #333;
}
.row .name { flex: 1; font-size: 15px; color: #fff; font-weight: 900; }
.row .price { flex: 1; text-align: center; font-size: 13px; color: #aaa; }
.row .highlight { flex: 1; text-align: center; font-size: 22px; color: #ff6b00; font-weight: 900; }
.row .desc { flex: 1; text-align: right; font-size: 12px; color: #777; }

.cta-zone {
  margin-top: 32px;
  border-top: 1px solid #444;
  padding-top: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.cta-text {
  font-size: 12px;
  color: #666;
  letter-spacing: 1px;
  font-weight: 700;
}
.cta-btn {
  background: #ff6b00;
  color: #fff;
  border: none;
  padding: 14px 36px;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 2px;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="poster">
  <div class="geo-area">
    <svg class="svg-deco" viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg">
      <!-- 工业警示条纹 -->
      <rect x="0" y="0" width="600" height="12" fill="#ff6b00" opacity="0.9"/>
      <rect x="0" y="268" width="600" height="12" fill="#ff6b00" opacity="0.9"/>
      <!-- 对角线网格 -->
      <line x1="0" y1="0" x2="600" y2="280" stroke="#222" stroke-width="1"/>
      <line x1="600" y1="0" x2="0" y2="280" stroke="#222" stroke-width="1"/>
      <line x1="0" y1="140" x2="600" y2="140" stroke="#333" stroke-width="1"/>
      <!-- 抽象无人机/工具几何 -->
      <polygon points="300,50 340,90 340,190 300,230 260,190 260,90" 
               fill="none" stroke="#ff6b00" stroke-width="2.5"/>
      <rect x="280" y="110" width="40" height="40" fill="none" stroke="#fff" stroke-width="1.5" transform="rotate(45 300 130)"/>
      <line x1="260" y1="90" x2="220" y2="50" stroke="#ff6b00" stroke-width="2"/>
      <line x1="340" y1="90" x2="380" y2="50" stroke="#ff6b00" stroke-width="2"/>
      <line x1="260" y1="190" x2="220" y2="230" stroke="#ff6b00" stroke-width="2"/>
      <line x1="340" y1="190" x2="380" y2="230" stroke="#ff6b00" stroke-width="2"/>
      <!-- 螺丝点装饰 -->
      <circle cx="220" cy="140" r="3" fill="#ff6b00" opacity="0.8"/>
      <circle cx="380" cy="140" r="3" fill="#ff6b00" opacity="0.8"/>
      <circle cx="300" cy="60" r="3" fill="#ff6b00" opacity="0.8"/>
      <circle cx="300" cy="220" r="3" fill="#ff6b00" opacity="0.8"/>
      <!-- 测量刻度线 -->
      <line x1="50" y1="250" x2="50" y2="270" stroke="#ff6b00" stroke-width="1"/>
      <line x1="60" y1="255" x2="60" y2="270" stroke="#ff6b00" stroke-width="1"/>
      <line x1="70" y1="250" x2="70" y2="270" stroke="#ff6b00" stroke-width="1"/>
      <line x1="80" y1="255" x2="80" y2="270" stroke="#ff6b00" stroke-width="1"/>
      <line x1="90" y1="250" x2="90" y2="270" stroke="#ff6b00" stroke-width="1"/>
    </svg>
    <div class="brand-tag">MAOXIAOJIANG</div>
    <div class="main-title">喵修盾<br><span>维修额度保障</span></div>
  </div>

  <div class="content">
    <div class="pain-block">
      <h3>客户问得最多：坏了怎么办？</h3>
      <p>销售二手无人机或租赁时，无质保则成交率大打折扣。喵修匠将维修能力产品化，为数码店主提供可销售的保障卡。</p>
    </div>

    <div class="grid-header">
      <div>产品</div>
      <div>售价</div>
      <div>维修额度</div>
      <div>折扣</div>
    </div>

    <div class="row">
      <div class="name">基础版</div>
      <div class="price">99元</div>
      <div class="highlight">800</div>
      <div class="desc">7折 / 6个月</div>
    </div>
    <div class="row">
      <div class="name">标准版</div>
      <div class="price">199元</div>
      <div class="highlight">1800</div>
      <div class="desc">6折 / 12个月</div>
    </div>
    <div class="row">
      <div class="name">尊享版</div>
      <div class="price">299元</div>
      <div class="highlight">3000</div>
      <div class="desc">5折 / 12个月</div>
    </div>

    <div class="cta-zone">
      <div class="cta-text">CONTACT FOR PARTNERSHIP</div>
      <div class="cta-btn">立即合作</div>
    </div>
  </div>
</div>
</body>
</html>
