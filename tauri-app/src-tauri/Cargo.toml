[package]
name = "omnia-manager"
version = "1.0.0"
description = "Omnia Memory Palace Manager"
authors = ["Omnia Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "omnia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
chrono = "0.4"
reqwest = { version = "0.12", features = ["blocking"] }
