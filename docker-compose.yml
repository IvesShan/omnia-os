version: "3.8"

services:
  omnia:
    build:
      context: .
      dockerfile: Dockerfile
    image: omnia/os:latest
    container_name: omnia
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # 数据持久化
      - omnia_data:/data
      # 可选：挂载本地配置
      # - ./omnia.yaml:/data/omnia.yaml:ro
      # 可选：挂载本地 skills
      # - ./skills:/app/skills:ro
    environment:
      # 时区
      - TZ=Asia/Shanghai
      # 从 .env 文件加载环境变量
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - QIANFAN_API_KEY=${QIANFAN_API_KEY:-}
      - MIMO_API_KEY=${MIMO_API_KEY:-}
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - FEISHU_VERIFY_TOKEN=${FEISHU_VERIFY_TOKEN:-}
    env_file:
      - .env
    networks:
      - omnia_network
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # 可选：Ollama 本地模型服务
  ollama:
    image: ollama/ollama:latest
    container_name: omnia-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - omnia_network
    profiles:
      - local-llm  # 只在启用 local-llm profile 时启动

volumes:
  omnia_data:
    driver: local
  ollama_data:
    driver: local

networks:
  omnia_network:
    driver: bridge
