<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnia 神经图谱 - 改进版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0a0f;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #fff;
        }
        
        #graph-container {
            width: 100vw;
            height: 100vh;
        }
        
        /* 顶部工具栏 */
        .toolbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 100;
        }
        
        .search-box {
            background: rgba(0, 21, 26, 0.9);
            border: 1px solid rgba(255, 138, 0, 0.3);
            border-radius: 8px;
            padding: 8px 16px;
            color: #fff;
            width: 300px;
        }
        
        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .filter-btn {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #00ffff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .filter-btn:hover, .filter-btn.active {
            background: rgba(0, 255, 255, 0.2);
            border-color: #00ffff;
        }
        
        /* 统计面板 */
        .stats-panel {
            position: fixed;
            top: 80px;
            right: 20px;
            background: rgba(0, 21, 26, 0.9);
            border: 1px solid rgba(255, 138, 0, 0.2);
            border-radius: 12px;
            padding: 16px;
            z-index: 100;
            min-width: 200px;
        }
        
        .stats-panel h3 {
            color: #ff8a00;
            margin-bottom: 12px;
            font-size: 14px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 13px;
        }
        
        .stat-value {
            color: #00ffff;
            font-weight: bold;
        }
        
        /* 节点详情面板 */
        .detail-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 21, 26, 0.95);
            border: 1px solid rgba(255, 138, 0, 0.3);
            border-radius: 12px;
            padding: 16px;
            z-index: 100;
            max-width: 300px;
            display: none;
        }
        
        .detail-panel.show {
            display: block;
        }
        
        .detail-panel h4 {
            color: #ff8a00;
            margin-bottom: 8px;
        }
        
        .detail-panel p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            margin: 4px 0;
        }
        
        /* 加载提示 */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff8a00;
            font-size: 18px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="graph-container"></div>
    
    <div class="toolbar">
        <input type="text" class="search-box" id="search-input" placeholder="搜索节点...">
        <button class="filter-btn active" data-type="all">全部</button>
        <button class="filter-btn" data-type="PERSON">人物</button>
        <button class="filter-btn" data-type="PROJECT">项目</button>
        <button class="filter-btn" data-type="FILE">文件</button>
        <button class="filter-btn" data-type="CONCEPT">概念</button>
    </div>
    
    <div class="stats-panel" id="stats-panel">
        <h3>📊 图谱统计</h3>
        <div class="stat-item">
            <span>总节点</span>
            <span class="stat-value" id="total-nodes">-</span>
        </div>
        <div class="stat-item">
            <span>总边数</span>
            <span class="stat-value" id="total-edges">-</span>
        </div>
        <div class="stat-item">
            <span>显示节点</span>
            <span class="stat-value" id="visible-nodes">-</span>
        </div>
        <div class="stat-item">
            <span>显示边数</span>
            <span class="stat-value" id="visible-edges">-</span>
        </div>
    </div>
    
    <div class="detail-panel" id="detail-panel">
        <h4 id="node-name">节点名称</h4>
        <p id="node-type">类型: -</p>
        <p id="node-connections">连接数: -</p>
    </div>
    
    <div class="loading" id="loading">正在加载图谱...</div>
    
    <script type="module">
        import { NeuralGraphPorweb } from './js/neural-graph-porweb.js';
        
        // 全局变量
        let allNodes = [];
        let allEdges = [];
        let currentFilter = 'all';
        
        // 加载图谱数据
        async function loadGraphData() {
            try {
                const response = await fetch('/api/neural-graph/export');
                const data = await response.json();
                
                allNodes = data.nodes || [];
                allEdges = data.edges || [];
                
                // 更新统计
                document.getElementById('total-nodes').textContent = allNodes.length;
                document.getElementById('total-edges').textContent = allEdges.length;
                document.getElementById('visible-nodes').textContent = allNodes.length;
                document.getElementById('visible-edges').textContent = allEdges.length;
                
                // 隐藏加载提示
                document.getElementById('loading').style.display = 'none';
                
                console.log('✅ 图谱数据加载完成:', allNodes.length, '个节点,', allEdges.length, '条边');
                
            } catch (error) {
                console.error('❌ 加载失败:', error);
                document.getElementById('loading').textContent = '加载失败: ' + error.message;
            }
        }
        
        // 搜索功能
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            
            if (!query) {
                updateVisibleCount(allNodes.length, allEdges.length);
                return;
            }
            
            const matchedNodes = allNodes.filter(n => 
                n.name.toLowerCase().includes(query)
            );
            
            updateVisibleCount(matchedNodes.length, '-');
        });
        
        // 筛选功能
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // 更新按钮状态
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const type = btn.dataset.type;
                currentFilter = type;
                
                if (type === 'all') {
                    updateVisibleCount(allNodes.length, allEdges.length);
                } else {
                    const filteredNodes = allNodes.filter(n => n.type === type);
                    const filteredEdges = allEdges.filter(e => 
                        filteredNodes.some(n => n.name === e.source || n.name === e.target)
                    );
                    updateVisibleCount(filteredNodes.length, filteredEdges.length);
                }
            });
        });
        
        function updateVisibleCount(nodes, edges) {
            document.getElementById('visible-nodes').textContent = nodes;
            document.getElementById('visible-edges').textContent = edges;
        }
        
        // 加载统计
        async function loadStats() {
            try {
                const response = await fetch('/api/neural-graph/stats');
                const stats = await response.json();
                
                // 按类型统计
                const typeStats = stats.nodes_by_type || {};
                const statsHtml = Object.entries(typeStats)
                    .map(([type, count]) => `<div class="stat-item"><span>${type}</span><span class="stat-value">${count}</span></div>`)
                    .join('');
                
                // 添加到统计面板
                document.getElementById('stats-panel').innerHTML += `
                    <h3 style="margin-top: 16px;">📊 节点类型</h3>
                    ${statsHtml}
                `;
                
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }
        
        // 初始化
        loadGraphData();
        loadStats();
        
        // 初始化 3D 图谱
        const container = document.getElementById('graph-container');
        const graph = new NeuralGraphPorweb(container);
    </script>
</body>
</html>
