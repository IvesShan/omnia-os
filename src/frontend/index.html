<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnia 管理面板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 顶部导航 -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <h1 class="text-2xl font-bold text-indigo-600">Omnia</h1>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="#" data-tab="dashboard" class="tab-link border-indigo-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">仪表盘</a>
                        <a href="#" data-tab="memory" class="tab-link border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">记忆管理</a>
                        <a href="#" data-tab="graph" class="tab-link border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">神经图谱</a>
                        <a href="#" data-tab="skills" class="tab-link border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">技能管理</a>
                        <a href="#" data-tab="logs" class="tab-link border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">日志监控</a>
                    </div>
                </div>
                <div class="flex items-center">
                    <span id="status-indicator" class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800">
                        <span class="w-2 h-2 mr-2 bg-green-400 rounded-full animate-pulse"></span>
                        运行中
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
        
        <!-- 仪表盘 -->
        <div id="tab-dashboard" class="tab-content">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <!-- 状态卡片 -->
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 bg-indigo-100 rounded-md p-3">
                            <svg class="h-6 w-6 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-500">系统状态</p>
                            <p id="system-status" class="text-lg font-semibold text-gray-900">加载中...</p>
                        </div>
                    </div>
                </div>

                <!-- 记忆数量 -->
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 bg-purple-100 rounded-md p-3">
                            <svg class="h-6 w-6 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                            </svg>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-500">记忆总数</p>
                            <p id="memory-count" class="text-lg font-semibold text-gray-900">-</p>
                        </div>
                    </div>
                </div>

                <!-- 技能数量 -->
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 bg-green-100 rounded-md p-3">
                            <svg class="h-6 w-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                            </svg>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-500">技能数量</p>
                            <p id="skills-count" class="text-lg font-semibold text-gray-900">-</p>
                        </div>
                    </div>
                </div>

                <!-- 最后活动 -->
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 bg-yellow-100 rounded-md p-3">
                            <svg class="h-6 w-6 text-yellow-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-500">最后活动</p>
                            <p id="last-activity" class="text-lg font-semibold text-gray-900">-</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 记忆分布 -->
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-medium text-gray-900 mb-4">记忆分布</h3>
                <div id="memory-distribution" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="text-center p-4 bg-indigo-50 rounded-lg">
                        <p class="text-3xl font-bold text-indigo-600" id="facts-count">-</p>
                        <p class="text-sm text-gray-600">Facts</p>
                    </div>
                    <div class="text-center p-4 bg-purple-50 rounded-lg">
                        <p class="text-3xl font-bold text-purple-600" id="relations-count">-</p>
                        <p class="text-sm text-gray-600">Relations</p>
                    </div>
                    <div class="text-center p-4 bg-green-50 rounded-lg">
                        <p class="text-3xl font-bold text-green-600" id="habits-count">-</p>
                        <p class="text-sm text-gray-600">Habits</p>
                    </div>
                    <div class="text-center p-4 bg-yellow-50 rounded-lg">
                        <p class="text-3xl font-bold text-yellow-600" id="timeline-count">-</p>
                        <p class="text-sm text-gray-600">Timeline</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 记忆管理 -->
        <div id="tab-memory" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow">
                <div class="p-6 border-b border-gray-200">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-medium text-gray-900">记忆搜索</h3>
                        <div class="flex space-x-2">
                            <select id="memory-layer-filter" class="rounded-md border-gray-300 text-sm">
                                <option value="">所有层</option>
                                <option value="facts">Facts</option>
                                <option value="relations">Relations</option>
                                <option value="habits">Habits</option>
                                <option value="timeline">Timeline</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-4 flex">
                        <input type="text" id="memory-search-input" placeholder="搜索记忆..." 
                               class="flex-1 rounded-l-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
                        <button id="memory-search-btn" class="px-4 py-2 bg-indigo-600 text-white rounded-r-md hover:bg-indigo-700">
                            搜索
                        </button>
                    </div>
                </div>
                <div id="memory-results" class="p-6">
                    <p class="text-gray-500 text-center">输入关键词搜索记忆</p>
                </div>
            </div>
        </div>

        <!-- 神经图谱 -->
        <div id="tab-graph" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-medium text-gray-900 mb-4">神经图谱可视化</h3>
                <div id="graph-container" class="w-full h-96 bg-gray-50 rounded-lg flex items-center justify-center">
                    <p class="text-gray-500">图谱加载中...</p>
                </div>
            </div>
        </div>

        <!-- 技能管理 -->
        <div id="tab-skills" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow">
                <div class="p-6 border-b border-gray-200">
                    <h3 class="text-lg font-medium text-gray-900">已安装技能</h3>
                </div>
                <div id="skills-list" class="divide-y divide-gray-200">
                    <p class="p-6 text-gray-500 text-center">加载中...</p>
                </div>
            </div>
        </div>

        <!-- 日志监控 -->
        <div id="tab-logs" class="tab-content hidden">
            <div class="bg-white rounded-lg shadow">
                <div class="p-6 border-b border-gray-200 flex justify-between items-center">
                    <h3 class="text-lg font-medium text-gray-900">系统日志</h3>
                    <div class="flex items-center space-x-4">
                        <label class="flex items-center">
                            <input type="checkbox" id="auto-scroll" checked class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                            <span class="ml-2 text-sm text-gray-600">自动滚动</span>
                        </label>
                        <button id="clear-logs-btn" class="px-3 py-1 text-sm bg-gray-100 text-gray-700 rounded hover:bg-gray-200">
                            清空显示
                        </button>
                    </div>
                </div>
                <div id="logs-container" class="p-4 h-96 overflow-y-auto font-mono text-sm bg-gray-900 text-gray-100">
                    <p class="text-gray-400">日志加载中...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
