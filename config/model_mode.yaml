# Omnia 模型模式配置
# 当前模式: cloud (云端)

current_mode: cloud

# 本地模型配置
local:
  enabled: true
  backend: "transformers"  # transformers, vllm, llama.cpp
  model: "qwen3-8b"
  model_path: "/home/shan/models/Qwen3-8B"
  
# 云端模型配置
cloud:
  enabled: true
  provider: kimi
  model: "kimi-code"

# Kimi 配置 (Coding Plan)
kimi:
  enabled: true
  provider: kimi
  model: "kimi-code"
  api_key_env: "MOONSHOT_API_KEY"
  api_url: "https://api.kimi.com/coding/v1/messages"
