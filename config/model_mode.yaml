# Omnia 模型模式配置
# 当前模式: local (本地)

current_mode: cloud

# 本地模型配置
local:
  enabled: true
  backend: "transformers"  # transformers, vllm, llama.cpp
  model: "qwen3-8b"
  model_path: "/home/shan/models/Qwen3-8B"
  
# 云端模型配置
cloud:
  enabled: true
  provider: xiaomi
  model: "mimo-v2.5-pro"

# Xiaomi MiMo 配置
mimo:
  enabled: true
  provider: xiaomi
  model: "mimo-v2.5-pro"
  api_key_env: "MIMO_API_KEY"
