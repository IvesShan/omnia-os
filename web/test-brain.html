<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omnia 全息大脑测试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;  /* 移除背景色 */
      color: #22d3ee;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }
    #brain-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    .overlay {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(10, 10, 26, 0.8);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(34, 211, 238, 0.3);
    }
    .overlay h1 {
      font-size: 24px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #22d3ee, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .overlay p {
      font-size: 14px;
      color: #94a3b8;
    }
    .status {
      margin-top: 15px;
      padding: 10px;
      background: rgba(34, 211, 238, 0.1);
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 200;
    }
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(34, 211, 238, 0.2);
      border-top-color: #22d3ee;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>🧠 Omnia 全息大脑</h1>
    <p>神经图谱可视化 - Three.js</p>
    <div class="status" id="status">正在初始化...</div>
  </div>
  
  <div id="brain-container"></div>
  
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <div style="color: #22d3ee;">正在唤醒记忆...</div>
  </div>
  
  <!-- Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    
    const statusEl = document.getElementById('status');
    const loadingEl = document.getElementById('loading');
    
    // 场景
    const scene = new THREE.Scene();
    // 移除背景色，使用透明背景
    // scene.background = new THREE.Color(0x0a0a1a);
    scene.fog = new THREE.FogExp2(0x0a0a1a, 0.015);
    
    // 容器
    const container = document.getElementById('brain-container');
    const width = container.clientWidth;
    const height = container.clientHeight;
    
    // 相机
    const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
    camera.position.set(0, 0, 50);
    
    // 渲染器
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.5;
    container.appendChild(renderer.domElement);
    
    // Bloom 后期处理
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(width, height),
      1.5, 0.4, 0.85
    );
    composer.addPass(bloomPass);
    
    // 控制器 - 提高自动旋转速度
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.0;  // 提高自动旋转速度
    controls.minDistance = 20;
    controls.maxDistance = 100;
    controls.enablePan = true;
    controls.enableZoom = true;
    
    statusEl.textContent = '✓ 渲染器初始化完成';
    
    // 创建大脑
    const brainGroup = new THREE.Group();
    
    // 大脑轮廓
    const brainGeometry = new THREE.IcosahedronGeometry(15, 3);
    const brainMaterial = new THREE.MeshPhongMaterial({
      color: 0x1e293b,
      transparent: true,
      opacity: 0.3,
      wireframe: true,
      emissive: 0x06b6d4,
      emissiveIntensity: 0.1
    });
    brainGroup.add(new THREE.Mesh(brainGeometry, brainMaterial));
    
    // 神经网络线条
    const lineMaterial = new THREE.LineBasicMaterial({
      color: 0x22d3ee,
      transparent: true,
      opacity: 0.3
    });
    
    for (let i = 0; i < 50; i++) {
      const points = [];
      const startAngle = Math.random() * Math.PI * 2;
      const endAngle = startAngle + Math.PI * (0.5 + Math.random());
      
      for (let j = 0; j <= 20; j++) {
        const t = j / 20;
        const angle = startAngle + (endAngle - startAngle) * t;
        const radius = 10 + Math.sin(t * Math.PI) * 5;
        points.push(new THREE.Vector3(
          Math.cos(angle) * radius * (0.8 + Math.random() * 0.4),
          (Math.random() - 0.5) * 20,
          Math.sin(angle) * radius * (0.8 + Math.random() * 0.4)
        ));
      }
      
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      brainGroup.add(new THREE.Line(geometry, lineMaterial));
    }
    
    scene.add(brainGroup);
    statusEl.textContent = '✓ 大脑模型创建完成';
    
    // 创建粒子 - 移除上下摆动效果
    const particleCount = 2000;
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    
    const color1 = new THREE.Color(0x22d3ee);
    const color2 = new THREE.Color(0xa855f7);
    
    for (let i = 0; i < particleCount; i++) {
      const radius = 20 + Math.random() * 30;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      
      positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
      positions[i * 3 + 2] = radius * Math.cos(phi);
      
      const color = color1.clone().lerp(color2, Math.random());
      colors[i * 3] = color.r;
      colors[i * 3 + 1] = color.g;
      colors[i * 3 + 2] = color.b;
    }
    
    const particleGeometry = new THREE.BufferGeometry();
    particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    
    const particles = new THREE.Points(particleGeometry, new THREE.PointsMaterial({
      size: 0.5,
      vertexColors: true,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending
    }));
    scene.add(particles);
    
    statusEl.textContent = '✓ 粒子系统创建完成';
    
    // 光源
    scene.add(new THREE.AmbientLight(0x404040, 0.5));
    
    const light1 = new THREE.PointLight(0x22d3ee, 2, 100);
    light1.position.set(20, 20, 20);
    scene.add(light1);
    
    const light2 = new THREE.PointLight(0xa855f7, 2, 100);
    light2.position.set(-20, -20, 20);
    scene.add(light2);
    
    // 知识节点
    const knowledgeNodes = [];
    const typeColors = {
      'PERSON': 0x06b6d4,
      'PROJECT': 0xa855f7,
      'FILE': 0x10b981,
      'CONCEPT': 0xf59e0b,
      'default': 0x6366f1
    };
    
    fetch('/api/graph?limit=100')
      .then(res => res.json())
      .then(data => {
        if (data.nodes && data.nodes.length > 0) {
          statusEl.textContent = `✓ 加载 ${data.nodes.length} 个知识节点`;
          
          data.nodes.forEach((node, index) => {
            const type = node.type || 'default';
            const color = typeColors[type] || typeColors.default;
            
            const phi = Math.acos(-1 + (2 * index) / data.nodes.length);
            const theta = Math.sqrt(data.nodes.length * Math.PI) * phi;
            const radius = 18 + Math.random() * 5;
            
            const geometry = new THREE.SphereGeometry(0.8, 16, 16);
            const material = new THREE.MeshPhongMaterial({
              color: color,
              emissive: color,
              emissiveIntensity: 0.5,
              transparent: true,
              opacity: 0.9
            });
            
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(
              radius * Math.cos(theta) * Math.sin(phi),
              radius * Math.sin(theta) * Math.sin(phi),
              radius * Math.cos(phi)
            );
            mesh.userData = { id: node.name || node.id, type: type };
            
            scene.add(mesh);
            knowledgeNodes.push(mesh);
          });
          
          loadingEl.style.display = 'none';
        } else {
          statusEl.textContent = '⚠ 暂无知识节点数据';
          loadingEl.style.display = 'none';
        }
      })
      .catch(err => {
        statusEl.textContent = `✗ 加载失败: ${err.message}`;
        loadingEl.style.display = 'none';
      });
    
    // 动画 - 移除大脑和粒子的额外旋转，只使用 OrbitControls 的 autoRotate
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      
      time += 0.01;
      
      // 移除大脑额外旋转（使用 OrbitControls 的 autoRotate）
      // brainGroup.rotation.y += 0.002;
      
      // 移除粒子额外旋转
      // particles.rotation.y += 0.0005;
      
      // 节点脉动
      knowledgeNodes.forEach((node, i) => {
        const scale = 1 + Math.sin(time * 2 + i) * 0.1;
        node.scale.setScalar(scale);
      });
      
      controls.update();
      composer.render();
    }
    
    animate();
    
    // 窗口调整
    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
    });
  </script>
</body>
</html>
