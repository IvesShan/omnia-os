<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神经图谱物理引擎优化测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    
    .container {
      display: flex;
      height: 100vh;
    }
    
    .graph-area {
      flex: 1;
      position: relative;
    }
    
    #graph-canvas {
      width: 100%;
      height: 100%;
    }
    
    .sidebar {
      width: 350px;
      background: rgba(15, 17, 23, 0.95);
      border-left: 1px solid rgba(100, 116, 139, 0.2);
      padding: 20px;
      overflow-y: auto;
    }
    
    h1 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #22d3ee;
    }
    
    h2 {
      font-size: 16px;
      margin: 20px 0 10px;
      color: #94a3b8;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .stat-card {
      background: rgba(100, 116, 139, 0.1);
      border: 1px solid rgba(100, 116, 139, 0.2);
      border-radius: 8px;
      padding: 12px;
    }
    
    .stat-label {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 4px;
    }
    
    .stat-value {
      font-size: 18px;
      font-weight: 600;
      color: #e2e8f0;
    }
    
    .stat-value.success {
      color: #22c55e;
    }
    
    .stat-value.warning {
      color: #f59e0b;
    }
    
    .stat-value.error {
      color: #ef4444;
    }
    
    .control-group {
      margin-bottom: 15px;
    }
    
    .control-label {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }
    
    .control-value {
      color: #64748b;
      font-family: monospace;
    }
    
    input[type="range"] {
      width: 100%;
      height: 6px;
      background: rgba(100, 116, 139, 0.2);
      border-radius: 3px;
      outline: none;
    }
    
    input[type="range"]::-webkit-slider-thumb {
      width: 16px;
      height: 16px;
      background: #22d3ee;
      border-radius: 50%;
      cursor: pointer;
    }
    
    button {
      background: rgba(34, 211, 238, 0.2);
      border: 1px solid rgba(34, 211, 238, 0.4);
      color: #22d3ee;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      margin-right: 8px;
      margin-bottom: 8px;
    }
    
    button:hover {
      background: rgba(34, 211, 238, 0.3);
    }
    
    button.active {
      background: rgba(34, 211, 238, 0.4);
      border-color: #22d3ee;
    }
    
    .log-panel {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(100, 116, 139, 0.2);
      border-radius: 8px;
      padding: 10px;
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 11px;
      line-height: 1.6;
    }
    
    .log-entry {
      color: #94a3b8;
    }
    
    .log-entry.success {
      color: #22c55e;
    }
    
    .log-entry.warning {
      color: #f59e0b;
    }
    
    .log-entry.error {
      color: #ef4444;
    }
    
    .bug-info {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 15px;
      margin: 20px 0;
    }
    
    .bug-title {
      color: #ef4444;
      font-weight: 600;
      margin-bottom: 10px;
    }
    
    .bug-list {
      list-style: none;
      padding: 0;
    }
    
    .bug-list li {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 8px;
      padding-left: 20px;
      position: relative;
    }
    
    .bug-list li::before {
      content: '🐛';
      position: absolute;
      left: 0;
    }
    
    .fix-info {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 8px;
      padding: 15px;
      margin: 20px 0;
    }
    
    .fix-title {
      color: #22c55e;
      font-weight: 600;
      margin-bottom: 10px;
    }
    
    .fix-list {
      list-style: none;
      padding: 0;
    }
    
    .fix-list li {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 8px;
      padding-left: 20px;
      position: relative;
    }
    
    .fix-list li::before {
      content: '✅';
      position: absolute;
      left: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="graph-area">
      <div id="graph-canvas"></div>
    </div>
    
    <div class="sidebar">
      <h1>🧠 神经图谱优化测试</h1>
      
      <div class="bug-info">
        <div class="bug-title">🐛 发现的 Bug</div>
        <ul class="bug-list">
          <li>点击节点时错误地移动节点位置</li>
          <li>节点堆在一起（向心力太强）</li>
          <li>距离太小导致力爆炸（除以0）</li>
          <li>节点飞出画布无边界约束</li>
        </ul>
      </div>
      
      <div class="fix-info">
        <div class="fix-title">✅ 修复方案</div>
        <ul class="fix-list">
          <li>添加拖拽距离检测（>5px才算拖拽）</li>
          <li>添加最小距离限制（5px）</li>
          <li>只对远离中心的节点施加向心力</li>
          <li>添加边界约束和反弹</li>
          <li>网格布局初始位置（防重叠）</li>
        </ul>
      </div>
      
      <h2>📊 实时统计</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">FPS</div>
          <div class="stat-value" id="fps">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">节点数</div>
          <div class="stat-value" id="node-count">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">边数</div>
          <div class="stat-value" id="link-count">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">状态</div>
          <div class="stat-value" id="convergence-status">运行中</div>
        </div>
      </div>
      
      <h2>⚙️ 物理参数</h2>
      <div class="control-group">
        <div class="control-label">
          <span>斥力强度</span>
          <span class="control-value" id="repulsion-value">-300</span>
        </div>
        <input type="range" id="repulsion" min="-1000" max="-50" value="-300" step="10">
      </div>
      
      <div class="control-group">
        <div class="control-label">
          <span>向心力</span>
          <span class="control-value" id="center-force-value">0.002</span>
        </div>
        <input type="range" id="center-force" min="0" max="0.02" value="0.002" step="0.001">
      </div>
      
      <div class="control-group">
        <div class="control-label">
          <span>阻尼系数</span>
          <span class="control-value" id="damping-value">0.90</span>
        </div>
        <input type="range" id="damping" min="0.8" max="0.99" value="0.90" step="0.01">
      </div>
      
      <div class="control-group">
        <div class="control-label">
          <span>最大速度</span>
          <span class="control-value" id="max-velocity-value">8</span>
        </div>
        <input type="range" id="max-velocity" min="1" max="20" value="8" step="1">
      </div>
      
      <h2>🎮 操作</h2>
      <button id="btn-reset">🔄 重置图谱</button>
      <button id="btn-shake">💥 扰动测试</button>
      <button id="btn-center">🎯 居中视图</button>
      
      <h2>📝 日志</h2>
      <div class="log-panel" id="log-panel">
        <div class="log-entry">等待初始化...</div>
      </div>
    </div>
  </div>
  
  <script src="/graph-viz.js"></script>
  <script>
    // 日志函数
    function log(message, type = '') {
      const logPanel = document.getElementById('log-panel');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logPanel.appendChild(entry);
      logPanel.scrollTop = logPanel.scrollHeight;
      
      // 限制日志数量
      while (logPanel.children.length > 50) {
        logPanel.removeChild(logPanel.firstChild);
      }
    }
    
    // 更新统计信息
    function updateStats() {
      if (window.GraphViz) {
        const status = window.GraphViz.getConvergenceStatus();
        
        document.getElementById('fps').textContent = status.fps;
        document.getElementById('node-count').textContent = window.GraphViz.nodes.length;
        document.getElementById('link-count').textContent = window.GraphViz.links.length;
        
        const statusEl = document.getElementById('convergence-status');
        if (status.isConverged) {
          statusEl.textContent = '✓ 已收敛';
          statusEl.className = 'stat-value success';
        } else {
          statusEl.textContent = `${status.frameCount}/${status.requiredFrames}`;
          statusEl.className = 'stat-value warning';
        }
      }
      requestAnimationFrame(updateStats);
    }
    
    // 参数滑块事件
    document.getElementById('repulsion').addEventListener('input', (e) => {
      const value = parseFloat(e.target.value);
      document.getElementById('repulsion-value').textContent = value;
      if (window.GraphViz) {
        window.GraphViz.physics.repulsion = value;
        window.GraphViz.resetConvergence();
        log(`斥力强度: ${value}`, 'warning');
      }
    });
    
    document.getElementById('center-force').addEventListener('input', (e) => {
      const value = parseFloat(e.target.value);
      document.getElementById('center-force-value').textContent = value.toFixed(3);
      if (window.GraphViz) {
        window.GraphViz.physics.centerForce = value;
        window.GraphViz.resetConvergence();
        log(`向心力: ${value.toFixed(3)}`, 'warning');
      }
    });
    
    document.getElementById('damping').addEventListener('input', (e) => {
      const value = parseFloat(e.target.value);
      document.getElementById('damping-value').textContent = value.toFixed(2);
      if (window.GraphViz) {
        window.GraphViz.physics.damping = value;
        window.GraphViz.resetConvergence();
        log(`阻尼系数: ${value.toFixed(2)}`, 'warning');
      }
    });
    
    document.getElementById('max-velocity').addEventListener('input', (e) => {
      const value = parseFloat(e.target.value);
      document.getElementById('max-velocity-value').textContent = value;
      if (window.GraphViz) {
        window.GraphViz.physics.maxVelocity = value;
        window.GraphViz.resetConvergence();
        log(`最大速度: ${value}`, 'warning');
      }
    });
    
    // 按钮事件
    document.getElementById('btn-reset').addEventListener('click', () => {
      if (window.GraphViz) {
        window.GraphViz.destroy();
        window.GraphViz.isInitialized = false;
        window.GraphViz.init();
        log('🔄 图谱已重置', 'success');
      }
    });
    
    document.getElementById('btn-shake').addEventListener('click', () => {
      if (window.GraphViz) {
        window.GraphViz.nodes.forEach(node => {
          node.vx += (Math.random() - 0.5) * 10;
          node.vy += (Math.random() - 0.5) * 10;
        });
        window.GraphViz.resetConvergence();
        log('💥 扰动测试', 'warning');
      }
    });
    
    document.getElementById('btn-center').addEventListener('click', () => {
      if (window.GraphViz) {
        window.GraphViz.transform.x = 0;
        window.GraphViz.transform.y = 0;
        window.GraphViz.transform.scale = 1;
        log('🎯 视图已居中', 'success');
      }
    });
    
    // 初始化
    window.addEventListener('load', async () => {
      log('🚀 开始初始化图谱...', 'success');
      
      try {
        await window.GraphViz.init();
        log(`✅ 图谱加载完成：${window.GraphViz.nodes.length} 节点，${window.GraphViz.links.length} 边`, 'success');
      } catch (error) {
        log(`❌ 初始化失败: ${error.message}`, 'error');
      }
      
      updateStats();
    });
  </script>
</body>
</html>
