<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omnia · 设置</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 40px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 28px; font-weight: 600; margin-bottom: 32px; background: linear-gradient(135deg, #22d3ee, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .section { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    .section-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; color: #22d3ee; text-transform: uppercase; letter-spacing: 1px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 13px; color: #888; margin-bottom: 8px; }
    .form-input { width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 14px; }
    .form-input:focus { outline: none; border-color: #22d3ee; }
    .form-select { width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 14px; }
    .btn { padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; border: none; }
    .btn-primary { background: linear-gradient(135deg, #22d3ee, #a855f7); color: #000; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(34,211,238,0.3); }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }
    .status-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; }
    .status-dot.online { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
    .status-dot.offline { background: #ef4444; }
    .status-label { flex: 1; font-size: 14px; }
    .status-value { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #888; }
    .log-viewer { background: #000; border-radius: 8px; padding: 16px; height: 300px; overflow-y: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.6; }
    .log-line { color: #888; }
    .log-line.error { color: #ef4444; }
    .log-line.info { color: #22d3ee; }
    .log-line.warn { color: #f59e0b; }
    .btn-group { display: flex; gap: 12px; margin-top: 20px; }
    .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 24px; border-radius: 8px; font-size: 14px; background: #22c55e; color: #000; opacity: 0; transition: opacity 0.3s; z-index: 999; }
    .toast.show { opacity: 1; }
    .toast.error { background: #ef4444; color: #fff; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; color: #22d3ee; text-decoration: none; font-size: 14px; margin-bottom: 24px; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <a class="back-link" href="/">← 返回聊天</a>
    <h1>⚙️ Omnia 设置</h1>
    
    <div class="section">
      <div class="section-title">服务状态</div>
      <div class="status-row">
        <div class="status-dot" id="backend-status"></div>
        <span class="status-label">后端服务</span>
        <span class="status-value" id="backend-pid">—</span>
      </div>
      <div class="status-row">
        <div class="status-dot" id="llm-status"></div>
        <span class="status-label">LLM 连接</span>
        <span class="status-value" id="llm-provider">—</span>
      </div>
      <div class="status-row">
        <div class="status-dot" id="memory-status"></div>
        <span class="status-label">记忆宫殿</span>
        <span class="status-value" id="memory-count">—</span>
      </div>
    </div>
    
    <div class="section">
      <div class="section-title">API 配置</div>
      <div class="form-group">
        <label class="form-label">API 提供商</label>
        <select class="form-select" id="api-provider">
          <option value="kimi">Kimi (Moonshot)</option>
          <option value="baidu">百度千帆</option>
          <option value="openai">OpenAI</option>
          <option value="deepseek">DeepSeek</option>
          <option value="qwen">通义千问</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">API Key</label>
        <input type="password" class="form-input" id="api-key" placeholder="sk-...">
      </div>
      <div class="form-group">
        <label class="form-label">模型</label>
        <input type="text" class="form-input" id="model-name" placeholder="moonshot-v1-8k">
      </div>
    </div>
    
    <div class="section">
      <div class="section-title">后端配置</div>
      <div class="form-group">
        <label class="form-label">端口</label>
        <input type="number" class="form-input" id="backend-port" value="8765" readonly>
      </div>
      <div class="form-group">
        <label class="form-label">日志级别</label>
        <select class="form-select" id="log-level">
          <option value="debug">Debug</option>
          <option value="info" selected>Info</option>
          <option value="warning">Warning</option>
          <option value="error">Error</option>
        </select>
      </div>
    </div>
    
    <div class="section">
      <div class="section-title">日志查看</div>
      <div class="log-viewer" id="log-viewer">
        <div class="log-line">正在加载日志...</div>
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary" id="btn-refresh-logs">🔄 刷新日志</button>
        <button class="btn btn-secondary" id="btn-clear-logs">🗑️ 清空显示</button>
      </div>
    </div>
    
    <div class="btn-group" style="justify-content: flex-end;">
      <button class="btn btn-secondary" id="btn-cancel">取消</button>
      <button class="btn btn-primary" id="btn-save">💾 保存配置</button>
    </div>
  </div>
  
  <div class="toast" id="toast"></div>
  
  <script>
    const API_BASE = window.location.origin;
    
    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => t.className = 'toast', 3000);
    }
    
    async function loadStatus() {
      try {
        const res = await fetch(API_BASE + '/api/status');
        const data = await res.json();
        
        // Backend status
        const bsDot = document.getElementById('backend-status');
        const bsPid = document.getElementById('backend-pid');
        bsDot.className = 'status-dot online';
        bsPid.textContent = 'PID: ' + (data.pid || '运行中');
        
        // LLM status
        const lsDot = document.getElementById('llm-status');
        const lsProv = document.getElementById('llm-provider');
        if (data.llm_provider) {
          lsDot.className = 'status-dot online';
          lsProv.textContent = data.llm_provider + ' / ' + (data.model || '默认');
        } else {
          lsDot.className = 'status-dot offline';
          lsProv.textContent = '未配置';
        }
        
        // Memory status
        const msDot = document.getElementById('memory-status');
        const msCount = document.getElementById('memory-count');
        if (data.memories !== undefined) {
          msDot.className = 'status-dot online';
          msCount.textContent = data.memories + ' 条记忆';
        } else {
          msDot.className = 'status-dot offline';
          msCount.textContent = '未知';
        }
      } catch (e) {
        document.getElementById('backend-status').className = 'status-dot offline';
        document.getElementById('backend-pid').textContent = '连接失败';
      }
    }
    
    async function loadConfig() {
      try {
        const res = await fetch(API_BASE + '/api/config');
        if (res.ok) {
          const config = await res.json();
          if (config.api_provider) document.getElementById('api-provider').value = config.api_provider;
          if (config.api_key) document.getElementById('api-key').value = config.api_key;
          if (config.model_name) document.getElementById('model-name').value = config.model_name;
          if (config.log_level) document.getElementById('log-level').value = config.log_level;
        }
      } catch (e) {
        console.warn('Config API not available, using defaults');
      }
    }
    
    async function saveConfig() {
      const config = {
        api_provider: document.getElementById('api-provider').value,
        api_key: document.getElementById('api-key').value,
        model_name: document.getElementById('model-name').value,
        log_level: document.getElementById('log-level').value
      };
      
      try {
        const res = await fetch(API_BASE + '/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(config)
        });
        if (res.ok) {
          showToast('✅ 配置已保存');
        } else {
          showToast('❌ 保存失败: ' + (await res.text()), true);
        }
      } catch (e) {
        showToast('❌ 保存失败: ' + e.message, true);
      }
    }
    
    async function loadLogs() {
      try {
        const res = await fetch(API_BASE + '/api/logs?lines=100');
        if (res.ok) {
          const data = await res.json();
          const viewer = document.getElementById('log-viewer');
          const lines = data.lines || data;
          if (Array.isArray(lines)) {
            viewer.innerHTML = lines.map(line => {
              let cls = 'log-line';
              if (line.includes('ERROR') || line.includes('error')) cls += ' error';
              else if (line.includes('WARN') || line.includes('warning')) cls += ' warn';
              else if (line.includes('INFO') || line.includes('info')) cls += ' info';
              return '<div class="' + cls + '">' + line + '</div>';
            }).join('');
            viewer.scrollTop = viewer.scrollHeight;
          }
        }
      } catch (e) {
        document.getElementById('log-viewer').innerHTML = '<div class="log-line error">无法加载日志</div>';
      }
    }
    
    document.getElementById('btn-save').addEventListener('click', saveConfig);
    document.getElementById('btn-cancel').addEventListener('click', () => window.location.href = '/');
    document.getElementById('btn-refresh-logs').addEventListener('click', loadLogs);
    document.getElementById('btn-clear-logs').addEventListener('click', () => {
      document.getElementById('log-viewer').innerHTML = '<div class="log-line">已清空</div>';
    });
    
    loadConfig();
    loadStatus();
    loadLogs();
    setInterval(loadStatus, 10000);
  </script>
</body>
</html>
