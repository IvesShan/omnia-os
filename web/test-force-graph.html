<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Force Graph 测试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      font-family: Inter, sans-serif;
      color: #fff;
      min-height: 100vh;
    }
    #graph-canvas {
      width: 100%;
      height: 100vh;
      background: transparent;
    }
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #22d3ee;
      font-size: 18px;
    }
  </style>
  <script src="https://unpkg.com/force-graph"></script>
</head>
<body>
  <div id="graph-canvas">
    <div class="loading">正在唤醒记忆...</div>
  </div>
  
  <script>
    // 类型颜色映射
    const typeColors = {
      'PERSON': '#22d3ee',
      'PROJECT': '#a855f7',
      'FILE': '#10b981',
      'CONCEPT': '#f59e0b',
      'DATE': '#6366f1',
      'ENTITY': '#ec4899',
      'DEFAULT': '#64748b'
    };
    
    function getTypeColor(type) {
      return typeColors[type?.toUpperCase()] || typeColors['DEFAULT'];
    }
    
    // 粒子系统
    let particles = [];
    let animationId = null;
    let graphData = { nodes: [], links: [] };
    
    async function loadGraph() {
      const container = document.getElementById('graph-canvas');
      
      try {
        const res = await fetch('/api/graph?limit=150');
        const data = await res.json();
        
        console.log('节点:', data.nodes?.length, '边:', data.edges?.length);
        
        if (!data.nodes || data.nodes.length === 0) {
          container.innerHTML = '<div class="loading">暂无图谱数据</div>';
          return;
        }
        
        // 创建 ID 映射
        const nameToId = {};
        data.nodes.forEach(n => {
          nameToId[n.name] = n.id;
          if (n.canonical_name) nameToId[n.canonical_name] = n.id;
        });
        
        // 准备数据
        graphData = {
          nodes: data.nodes.map(n => ({
            id: n.id,
            name: n.name || n.label || n.id,
            type: n.type || 'DEFAULT',
            accessCount: n.access_count || 0,
            val: Math.max(3, Math.min(12, (n.access_count || 0) * 0.5 + 4))
          })),
          links: data.edges
            .filter(e => nameToId[e.source] && nameToId[e.target])
            .slice(0, 200)
            .map(e => ({
              source: nameToId[e.source],
              target: nameToId[e.target],
              relation: e.relation || 'related'
            }))
        };
        
        // 清空容器
        container.innerHTML = '';
        
        // 创建 Force Graph
        const graph = ForceGraph()(container)
          .graphData(graphData)
          .width(container.clientWidth)
          .height(container.clientHeight)
          .backgroundColor('transparent')
          
          // 节点渲染
          .nodeCanvasObject((node, ctx, globalScale) => {
            const size = node.val * 2;
            const color = getTypeColor(node.type);
            
            // 外发光
            ctx.beginPath();
            ctx.arc(node.x, node.y, size + 4, 0, 2 * Math.PI);
            ctx.fillStyle = color + '20';
            ctx.fill();
            
            // 主节点
            ctx.beginPath();
            ctx.arc(node.x, node.y, size, 0, 2 * Math.PI);
            ctx.fillStyle = color;
            ctx.fill();
            
            // 内核高亮
            ctx.beginPath();
            ctx.arc(node.x, node.y, size * 0.4, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff40';
            ctx.fill();
            
            // 标签
            if (globalScale > 0.8) {
              ctx.font = `${Math.max(10, 12 / globalScale)}px Inter, sans-serif`;
              ctx.fillStyle = '#ffffff';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'top';
              ctx.fillText(node.name, node.x, node.y + size + 4);
            }
          })
          
          // 边渲染
          .linkCanvasObjectMode(() => 'after')
          .linkCanvasObject((link, ctx) => {
            const start = link.source;
            const end = link.target;
            
            if (!start || !end || !Number.isFinite(start.x) || !Number.isFinite(end.y)) return;
            
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(end.x, end.y);
            ctx.strokeStyle = 'rgba(100, 116, 139, 0.2)';
            ctx.lineWidth = 0.5;
            ctx.stroke();
          })
          
          // 力导向参数
          .d3AlphaDecay(0.02)
          .d3VelocityDecay(0.3)
          .linkDistance(50)
          .linkStrength(0.1)
          .chargeStrength(-120)
          .collideRadius(8)
          
          // 交互
          .enableNodeDrag(true)
          .enableZoomInteraction(true)
          .enablePanInteraction(true)
          
          // 点击节点
          .onNodeClick(node => {
            if (node) {
              console.log('点击节点:', node.name, node.type);
            }
          });
        
        // 启动粒子动画
        startParticleAnimation(graph, graphData);
        
        // 窗口调整
        window.addEventListener('resize', () => {
          graph.width(container.clientWidth).height(container.clientHeight);
        });
        
        console.log('Force Graph 渲染完成');
        
      } catch (err) {
        console.error('加载失败:', err);
        container.innerHTML = '<div class="loading">加载失败: ' + err.message + '</div>';
      }
    }
    
    function startParticleAnimation(graph, graphData) {
      // 创建粒子
      particles = [];
      const particleCount = 50;
      
      for (let i = 0; i < particleCount; i++) {
        particles.push({
          linkIndex: Math.floor(Math.random() * graphData.links.length),
          progress: Math.random(),
          speed: 0.005 + Math.random() * 0.01,
          size: 1 + Math.random() * 2
        });
      }
      
      const animate = () => {
        const container = document.getElementById('graph-canvas');
        const canvas = container.querySelector('canvas');
        if (!canvas) {
          animationId = requestAnimationFrame(animate);
          return;
        }
        
        const ctx = canvas.getContext('2d');
        
        // 绘制粒子
        particles.forEach(particle => {
          const link = graphData.links[particle.linkIndex];
          if (!link || !link.source || !link.target) return;
          
          const start = link.source;
          const end = link.target;
          
          if (!Number.isFinite(start.x) || !Number.isFinite(end.x)) return;
          
          // 更新位置
          particle.progress += particle.speed;
          if (particle.progress > 1) {
            particle.progress = 0;
            particle.linkIndex = Math.floor(Math.random() * graphData.links.length);
          }
          
          // 计算坐标
          const x = start.x + (end.x - start.x) * particle.progress;
          const y = start.y + (end.y - start.y) * particle.progress;
          
          // 绘制粒子
          ctx.beginPath();
          ctx.arc(x, y, particle.size, 0, 2 * Math.PI);
          ctx.fillStyle = '#22d3ee80';
          ctx.fill();
          
          // 拖尾
          const tailX = start.x + (end.x - start.x) * Math.max(0, particle.progress - 0.05);
          const tailY = start.y + (end.y - start.y) * Math.max(0, particle.progress - 0.05);
          
          ctx.beginPath();
          ctx.moveTo(tailX, tailY);
          ctx.lineTo(x, y);
          ctx.strokeStyle = '#22d3ee40';
          ctx.lineWidth = particle.size * 0.5;
          ctx.stroke();
        });
        
        animationId = requestAnimationFrame(animate);
      };
      
      animate();
    }
    
    // 页面加载
    loadGraph();
  </script>
</body>
</html>
