<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵修匠 - 维修商后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 24px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .stat-card .number { font-size: 36px; font-weight: bold; color: #667eea; }
        .stat-card .label { color: #666; margin-top: 5px; }
        .section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            background: #f0f0f0;
            border: none;
            font-size: 14px;
            transition: all 0.3s;
        }
        .tab.active {
            background: #667eea;
            color: white;
        }
        .order-list { display: flex; flex-direction: column; gap: 15px; }
        .order-card {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 15px;
        }
        .order-info { flex: 1; min-width: 200px; }
        .order-no { font-weight: 600; color: #333; font-size: 16px; }
        .order-meta { color: #666; font-size: 14px; margin-top: 5px; }
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-accepted { background: #d1ecf1; color: #0c5460; }
        .status-detected { background: #e2e3e5; color: #383d41; }
        .status-quoted { background: #d4edda; color: #155724; }
        .status-confirmed { background: #cce5ff; color: #004085; }
        .status-repairing { background: #f8d7da; color: #721c24; }
        .status-shipping { background: #e2d4f0; color: #5a4fcf; }
        .status-completed { background: #d1f2eb; color: #1e8449; }
        .order-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; }
        .btn-success { background: #28a745; color: white; }
        .btn-info { background: #17a2b8; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .inventory-category {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
        }
        .inventory-category h4 { margin-bottom: 10px; }
        .inventory-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        .low-stock { color: #dc3545; font-weight: 600; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .login-box h2 { text-align: center; margin-bottom: 30px; color: #333; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- 登录界面 -->
    <div id="loginView" class="login-container">
        <div class="login-box">
            <h2>🔧 喵修匠维修商后台</h2>
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="loginPhone" placeholder="请输入手机号" maxlength="11" value="13800138000">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码" value="test123">
            </div>
            <button class="btn btn-primary" style="width: 100%; padding: 12px;" onclick="login()">登录</button>
            <p style="text-align: center; margin-top: 20px; color: #666;">测试账号: 13800138000 / test123</p>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="mainView" class="hidden">
        <div class="header">
            <div>
                <h1>🔧 喵修匠维修商后台</h1>
                <div style="font-size: 14px; opacity: 0.9;" id="merchantInfo">加载中...</div>
            </div>
            <button class="btn btn-secondary" onclick="logout()">退出登录</button>
        </div>

        <div class="container">
            <!-- 统计卡片 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="number" id="statTotal">0</div>
                    <div class="label">总订单</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="statPending">0</div>
                    <div class="label">待处理</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="statRepairing">0</div>
                    <div class="label">维修中</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="statCompleted">0</div>
                    <div class="label">已完成</div>
                </div>
            </div>

            <!-- 订单管理 -->
            <div class="section">
                <div class="section-title">📋 订单管理</div>
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('all')">全部订单</button>
                    <button class="tab" onclick="switchTab('pending')">待接单</button>
                    <button class="tab" onclick="switchTab('accepted')">待检测</button>
                    <button class="tab" onclick="switchTab('quoted')">待确认</button>
                    <button class="tab" onclick="switchTab('repairing')">维修中</button>
                    <button class="tab" onclick="switchTab('shipping')">待发货</button>
                </div>
                <div class="order-list" id="orderList">
                    <p style="text-align: center; color: #999; padding: 40px;">加载中...</p>
                </div>
            </div>

            <!-- 库存管理 -->
            <div class="section">
                <div class="section-title">📦 库存管理</div>
                <div class="inventory-grid" id="inventoryList">
                    <p style="text-align: center; color: #999;">加载中...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 订单操作模态框 -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">订单操作</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // API配置 - 版本号v2强制刷新缓存
        const API_BASE = 'https://njuosun-miaoxiujiang-d3a96a8c70e.service.tcloudbase.com/api';
        const VERSION = 'v2';
        
        let allOrders = [];
        let currentTab = 'all';

        // 状态文本映射
        const statusText = {
            'pending': '待接单',
            'accepted': '已接单',
            'detected': '待报价',
            'quoted': '待确认',
            'confirmed': '已确认',
            'repairing': '维修中',
            'shipping': '待发货',
            'completed': '已完成',
            'cancelled': '已取消'
        };

        const statusClass = {
            'pending': 'status-pending',
            'accepted': 'status-accepted',
            'detected': 'status-detected',
            'quoted': 'status-quoted',
            'confirmed': 'status-confirmed',
            'repairing': 'status-repairing',
            'shipping': 'status-shipping',
            'completed': 'status-completed',
            'cancelled': 'status-secondary'
        };

        // 页面加载
        window.onload = function() {
            // 检查是否已登录
            const saved = localStorage.getItem('merchant');
            if (saved) {
                showMainView();
            }
        };

        function showMainView() {
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('mainView').classList.remove('hidden');
            document.getElementById('merchantInfo').textContent = '南京维修中心 | 13800138000';
            loadOrders();
        }

        function logout() {
            localStorage.removeItem('merchant');
            document.getElementById('mainView').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden');
        }

        function login() {
            const phone = document.getElementById('loginPhone').value;
            const password = document.getElementById('loginPassword').value;
            
            if (phone === '13800138000' && password === 'test123') {
                localStorage.setItem('merchant', JSON.stringify({id: 'M001', name: '南京维修中心', phone: phone}));
                showMainView();
            } else {
                alert('账号或密码错误');
            }
        }

        // 加载订单列表
        async function loadOrders() {
            try {
                console.log('开始加载订单...', VERSION);
                const res = await fetch(`${API_BASE}/merchant/orders?merchant_id=merch_001&access_code=3613`);
                console.log('HTTP状态:', res.status);
                
                if (!res.ok) {
                    throw new Error(`HTTP错误: ${res.status}`);
                }
                
                const data = await res.json();
                console.log('API响应:', data);

                if (data.success) {
                    allOrders = data.orders || [];
                    console.log('订单数量:', allOrders.length);
                    renderOrders();
                    updateStats();
                } else {
                    console.error('API返回错误:', data.message);
                    document.getElementById('orderList').innerHTML = 
                        `<p style="text-align: center; color: #dc3545; padding: 40px;">加载失败: ${data.message || '未知错误'}</p>`;
                }
            } catch (e) {
                console.error('加载订单失败:', e);
                document.getElementById('orderList').innerHTML = 
                    `<p style="text-align: center; color: #dc3545; padding: 40px;">加载失败: ${e.message}<br>请检查后端服务是否运行</p>`;
            }
        }

        // 渲染订单列表
        function renderOrders() {
            const list = document.getElementById('orderList');
            let orders = allOrders;

            if (currentTab !== 'all') {
                orders = allOrders.filter(o => o.status === currentTab);
            }

            if (orders.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #999; padding: 40px;">暂无订单</p>';
                return;
            }

            list.innerHTML = orders.map(order => `
                <div class="order-card">
                    <div class="order-info">
                        <div class="order-no">${order.order_no}</div>
                        <div class="order-meta">
                            ${order.drone_model} | ${order.customer_phone}<br>
                            ${order.problem_description?.substring(0, 50)}...
                        </div>
                    </div>
                    <div>
                        <span class="status-badge ${statusClass[order.status]}">${statusText[order.status]}</span>
                    </div>
                    <div class="order-actions">
                        <button class="btn btn-info" onclick="viewOrderDetail('${order.order_no}')">查看</button>
                        ${getActionButtons(order)}
                    </div>
                </div>
            `).join('');
        }

        // 根据状态获取操作按钮
        function getActionButtons(order) {
            const buttons = [];
            switch (order.status) {
                case 'pending':
                    buttons.push(`<button class="btn btn-primary" onclick="acceptOrder('${order.order_no}')">接单</button>`);
                    break;
                case 'accepted':
                    buttons.push(`<button class="btn btn-primary" onclick="detectOrder('${order.order_no}')">检测</button>`);
                    break;
                case 'detected':
                    buttons.push(`<button class="btn btn-primary" onclick="quoteOrder('${order.order_no}')">报价</button>`);
                    break;
                case 'confirmed':
                    buttons.push(`<button class="btn btn-success" onclick="startRepair('${order.order_no}')">开始维修</button>`);
                    break;
                case 'repairing':
                    buttons.push(`<button class="btn btn-success" onclick="completeRepair('${order.order_no}')">完成维修</button>`);
                    break;
                case 'shipping':
                    buttons.push(`<button class="btn btn-primary" onclick="shipOrder('${order.order_no}')">发货</button>`);
                    break;
            }
            return buttons.join('');
        }

        // 切换标签
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderOrders();
        }

        // 更新统计
        function updateStats() {
            document.getElementById('statTotal').textContent = allOrders.length;
            document.getElementById('statPending').textContent = 
                allOrders.filter(o => o.status === 'pending').length;
            document.getElementById('statRepairing').textContent = 
                allOrders.filter(o => ['accepted', 'detected', 'quoted', 'confirmed', 'repairing'].includes(o.status)).length;
            document.getElementById('statCompleted').textContent = 
                allOrders.filter(o => o.status === 'completed').length;
        }

        // 查看订单详情
        function viewOrderDetail(orderNo) {
            const order = allOrders.find(o => o.order_no === orderNo);
            if (!order) return;

            document.getElementById('modalTitle').textContent = '订单详情';
            document.getElementById('modalBody').innerHTML = `
                <p><strong>订单号:</strong> ${order.order_no}</p>
                <p><strong>状态:</strong> ${statusText[order.status]}</p>
                <p><strong>机型:</strong> ${order.drone_model}</p>
                <p><strong>故障:</strong> ${order.problem_description}</p>
                <p><strong>客户电话:</strong> ${order.customer_phone}</p>
                <p><strong>预估价格:</strong> ¥${order.estimated_price || '待检测'}</p>
                <p><strong>创建时间:</strong> ${order.created_at}</p>
            `;
            openModal();
        }

        // 接单
        async function acceptOrder(orderNo) {
            if (!confirm('确认接单?')) return;
            try {
                const res = await fetch(`${API_BASE}/order/accept`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_no: orderNo, merchant_id: 'merch_001', merchant_name: '物熵科技', access_code: '3613' })
                });
                const data = await res.json();
                if (data.success) {
                    alert('接单成功');
                    loadOrders();
                } else {
                    alert(data.message || '操作失败');
                }
            } catch (e) {
                alert('网络错误');
            }
        }

        // 检测订单
        function detectOrder(orderNo) {
            document.getElementById('modalTitle').textContent = '故障检测';
            document.getElementById('modalBody').innerHTML = `
                <div class="form-group">
                    <label>实际故障描述</label>
                    <textarea id="detectDesc" placeholder="请详细描述实际检测到的故障..." rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label>预估价格（元）</label>
                    <input type="number" id="detectPrice" placeholder="请输入预估价格">
                </div>
                <button class="btn btn-primary" onclick="submitDetect('${orderNo}')">提交检测</button>
            `;
            openModal();
        }

        async function submitDetect(orderNo) {
            const desc = document.getElementById('detectDesc').value;
            const price = document.getElementById('detectPrice').value;
            if (!desc || !price) { alert('请填写完整信息'); return; }
            
            try {
                const res = await fetch(`${API_BASE}/order/detect`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_no: orderNo, actual_problem: desc, merchant_id: 'merch_001', access_code: '3613' })
                });
                const data = await res.json();
                if (data.success) { alert('检测完成'); closeModal(); loadOrders(); }
                else { alert(data.message || '提交失败'); }
        }

        // 报价
        function quoteOrder(orderNo) {
            document.getElementById('modalTitle').textContent = '维修报价';
            document.getElementById('modalBody').innerHTML = `
                <div class="form-group">
                    <label>最终报价（元）</label>
                    <input type="number" id="quotePrice" placeholder="请输入最终维修价格">
                </div>
                <div class="form-group">
                    <label>报价说明</label>
                    <textarea id="quoteDesc" placeholder="配件费用、人工费用等明细..." rows="3"></textarea>
                </div>
                <button class="btn btn-primary" onclick="submitQuote('${orderNo}')">提交报价</button>
            `;
            openModal();
        }

        async function submitQuote(orderNo) {
            const price = document.getElementById('quotePrice').value;
            if (!price) { alert('请填写报价'); return; }
            
            try {
                const res = await fetch(`${API_BASE}/order/quote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_no: orderNo, total: parseFloat(price), merchant_id: 'merch_001', access_code: '3613' })
                });
                const data = await res.json();
                if (data.success) { alert('报价成功'); closeModal(); loadOrders(); }
                else { alert(data.message || '提交失败'); }
        }

        async function startRepair(orderNo) {
            if (!confirm('确认开始维修?')) return;
            try {
                const res = await fetch(`${API_BASE}/order/repair`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_no: orderNo, action: 'start', merchant_id: 'merch_001', access_code: '3613' })
                });
                const data = await res.json();
                if (data.success) { alert('已开始维修'); loadOrders(); }
                else { alert(data.message || '操作失败'); }
            } catch (e) {
                alert('操作失败');
            }
        }

        // 完成维修
        async function completeRepair(orderNo) {
            if (!confirm('确认维修完成?')) return;
            try {
                const res = await fetch(`${API_BASE}/order/repair`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_no: orderNo, action: 'complete', merchant_id: 'merch_001', access_code: '3613' })
                });
                const data = await res.json();
                if (data.success) { alert('维修完成'); loadOrders(); }
                else { alert(data.message || '操作失败'); }
        }

        // 发货
        function shipOrder(orderNo) {
            document.getElementById('modalTitle').textContent = '填写发货信息';
            document.getElementById('modalBody').innerHTML = `
                <div class="form-group">
                    <label>快递公司</label>
                    <select id="shipCarrier">
                        <option value="顺丰速运">顺丰速运</option>
                        <option value="京东物流">京东物流</option>
                        <option value="中通快递">中通快递</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>快递单号</label>
                    <input type="text" id="shipNo" placeholder="请输入快递单号">
                </div>
                <button class="btn btn-primary" onclick="submitShip('${orderNo}')">确认发货</button>
            `;
            openModal();
        }

        async function submitShip(orderNo) {
            const carrier = document.getElementById('shipCarrier').value;
            const expressNo = document.getElementById('shipNo').value;
            if (!expressNo) { alert('请填写快递单号'); return; }
            
            try {
                const res = await fetch(`${API_BASE}/order/ship`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_no: orderNo, carrier: carrier, tracking_no: expressNo, merchant_id: 'merch_001', access_code: '3613' })
                });
                const data = await res.json();
                if (data.success) { alert('发货成功'); closeModal(); loadOrders(); }
                else { alert(data.message || '发货失败'); }
        }

        // 模态框控制
        function openModal() {
            document.getElementById('orderModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('orderModal').classList.remove('active');
        }

        // 点击模态框背景关闭
        document.getElementById('orderModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
