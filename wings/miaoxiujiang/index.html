<!DOCTYPE html>

 <style>
 /* ===== 设计系统 CSS Variables ===== */
 :root {
 --bg-primary: #000000;
 --bg-secondary: #1C1C1E;
 --bg-tertiary: #2C2C2E;
 --bg-elevated: rgba(28, 28, 30, 0.95);

 --text-primary: #FFFFFF;
 --text-secondary: rgba(255,255,255,0.6);
 --text-tertiary: rgba(255,255,255,0.38);

 --accent-orange: #FF9500;
 --accent-blue: #0A84FF;
 --accent-green: #30D158;
 --accent-red: #FF453A;

 --border-subtle: rgba(255,255,255,0.1);

 --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;

 --text-xs: 12px;
 --text-sm: 14px;
 --text-base: 16px;
 --text-lg: 18px;
 --text-xl: 20px;

 --font-medium: 500;
 --font-semibold: 600;
 --font-bold: 700;

 --space-1: 4px;
 --space-2: 8px;
 --space-3: 12px;
 --space-4: 16px;
 --space-5: 20px;
 --space-6: 24px;

 --radius-sm: 6px;
 --radius-md: 10px;
 --radius-lg: 12px;
 --radius-xl: 16px;
 --radius-full: 9999px;
 }

 * { margin: 0; padding: 0; box-sizing: border-box; }

 body {
 font-family: var(--font-sans);
 background: var(--bg-primary);
 color: var(--text-primary);
 line-height: 1.5;
 height: 100vh;
 display: flex;
 flex-direction: column;
 }

 /* ===== 顶部导航 ===== */
 .header {
 display: flex;
 align-items: center;
 justify-content: space-between;
 padding: var(--space-4);
 border-bottom: 1px solid var(--border-subtle);
 background: var(--bg-primary);
 }

 .header-left {
 display: flex;
 align-items: center;
 gap: var(--space-3);
 }

 .header h1 {
 font-size: var(--text-lg);
 font-weight: var(--font-semibold);
 }

 .header-icon {
 width: 32px;
 height: 32px;
 background: linear-gradient(135deg, var(--accent-orange), #FFB340);
 border-radius: var(--radius-md);
 display: flex;
 align-items: center;
 justify-content: center;
 }

 .header-icon svg {
 width: 20px;
 height: 20px;
 color: #000;
 }

 .menu-btn {
 background: none;
 border: none;
 color: var(--text-secondary);
 cursor: pointer;
 padding: var(--space-2);
 position: relative;
 }

 /* ===== 消息区域 ===== */
 .chat-container {
 flex: 1;
 overflow-y: auto;
 padding: var(--space-4);
 display: flex;
 flex-direction: column;
 gap: var(--space-4);
 }

 .welcome-screen {
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 height: 100%;
 text-align: center;
 padding: var(--space-6);
 }

 .welcome-icon {
 width: 64px;
 height: 64px;
 background: linear-gradient(135deg, var(--accent-orange), #FFB340);
 border-radius: var(--radius-xl);
 display: flex;
 align-items: center;
 justify-content: center;
 margin-bottom: var(--space-5);
 }

 .welcome-icon svg {
 width: 32px;
 height: 32px;
 color: #000;
 }

 .welcome-title {
 font-size: var(--text-xl);
 font-weight: var(--font-bold);
 margin-bottom: var(--space-3);
 }

 .welcome-subtitle {
 color: var(--text-secondary);
 font-size: var(--text-base);
 margin-bottom: var(--space-6);
 max-width: 300px;
 }

 .suggestion-chips {
 display: flex;
 flex-wrap: wrap;
 gap: var(--space-2);
 justify-content: center;
 max-width: 340px;
 }

 .chip {
 background: var(--bg-secondary);
 border: 1px solid var(--border-subtle);
 color: var(--text-secondary);
 padding: var(--space-2) var(--space-4);
 border-radius: var(--radius-full);
 font-size: var(--text-sm);
 cursor: pointer;
 transition: all 0.2s;
 }

 .chip:hover {
 background: var(--bg-tertiary);
 border-color: rgba(255,255,255,0.2);
 color: var(--text-primary);
 }

 /* ===== 消息气泡 ===== */
 .message {
 display: flex;
 gap: var(--space-3);
 max-width: 90%;
 }

 .message.user {
 align-self: flex-end;
 flex-direction: row-reverse;
 }

 .message.ai {
 align-self: flex-start;
 }

 .message-avatar {
 width: 28px;
 height: 28px;
 border-radius: var(--radius-full);
 display: flex;
 align-items: center;
 justify-content: center;
 flex-shrink: 0;
 }

 .message.user .message-avatar {
 background: var(--accent-blue);
 }

 .message.ai .message-avatar {
 background: linear-gradient(135deg, var(--accent-orange), #FFB340);
 }

 .message-avatar svg {
 width: 16px;
 height: 16px;
 color: #000;
 }

 .message-content {
 padding: var(--space-3) var(--space-4);
 border-radius: var(--radius-lg);
 font-size: var(--text-base);
 line-height: 1.6;
 }

 .message.user .message-content {
 background: var(--accent-blue);
 color: #fff;
 border-bottom-right-radius: var(--space-1);
 }

 .message.ai .message-content {
 background: var(--bg-secondary);
 color: var(--text-primary);
 border: 1px solid var(--border-subtle);
 border-bottom-left-radius: var(--space-1);
 }

 /* ===== 诊断报告卡片 ===== */
 .diagnosis-card {
 background: var(--bg-tertiary);
 border-radius: var(--radius-lg);
 padding: var(--space-4);
 margin: var(--space-2) 0;
 border: 1px solid var(--border-subtle);
 }

 .diagnosis-card-header {
 display: flex;
 align-items: center;
 gap: var(--space-2);
 margin-bottom: var(--space-3);
 color: var(--accent-orange);
 font-weight: var(--font-semibold);
 }

 .diagnosis-card-header svg {
 width: 24px;
 height: 24px;
 }

 .diagnosis-section {
 margin-bottom: var(--space-3);
 }

 .diagnosis-section:last-child {
 margin-bottom: 0;
 }

 .diagnosis-section-title {
 font-size: var(--text-sm);
 color: var(--text-secondary);
 margin-bottom: var(--space-2);
 font-weight: var(--font-medium);
 }

 .diagnosis-section-content {
 font-size: var(--text-base);
 line-height: 1.6;
 }

 .diagnosis-parts {
 display: flex;
 flex-wrap: wrap;
 gap: var(--space-2);
 }

 .diagnosis-part-tag {
 background: rgba(255, 149, 0, 0.15);
 color: var(--accent-orange);
 padding: 4px 12px;
 border-radius: var(--radius-full);
 font-size: var(--text-sm);
 }

 .diagnosis-cost {
 background: var(--bg-secondary);
 padding: var(--space-3);
 border-radius: var(--radius-md);
 display: flex;
 justify-content: space-between;
 align-items: center;
 }

 .diagnosis-cost-label {
 color: var(--text-secondary);
 font-size: var(--text-sm);
 }

 .diagnosis-cost-value {
 color: var(--accent-orange);
 font-size: var(--text-xl);
 font-weight: var(--font-bold);
 }

 .diagnosis-actions {
 display: flex;
 gap: var(--space-2);
 margin-top: var(--space-3);
 }

 .diagnosis-btn {
 flex: 1;
 padding: var(--space-3);
 border: none;
 border-radius: var(--radius-md);
 font-weight: var(--font-semibold);
 cursor: pointer;
 font-size: var(--text-base);
 }

 .diagnosis-btn-primary {
 background: var(--accent-orange);
 color: #000;
 }

 .diagnosis-btn-secondary {
 background: var(--bg-secondary);
 color: var(--text-primary);
 border: 1px solid var(--border-subtle);
 }

 /* ===== 订单卡片 ===== */
 .order-card {
 background: var(--bg-tertiary);
 border-radius: var(--radius-lg);
 padding: var(--space-4);
 margin: var(--space-2) 0;
 border: 1px solid var(--border-subtle);
 }

 .order-card-header {
 display: flex;
 justify-content: space-between;
 align-items: center;
 margin-bottom: var(--space-3);
 }

 .order-id {
 font-size: var(--text-xs);
 color: var(--text-secondary);
 font-family: monospace;
 }

 .order-status {
 padding: 2px 8px;
 border-radius: var(--radius-sm);
 font-size: var(--text-xs);
 font-weight: var(--font-medium);
 }

 .order-status-pending {
 background: rgba(255,204,0,0.15);
 color: var(--accent-orange);
 }

 .order-info-row {
 display: flex;
 align-items: center;
 gap: var(--space-2);
 margin-bottom: var(--space-2);
 font-size: var(--text-sm);
 }

 .order-info-row svg {
 width: 16px;
 height: 16px;
 color: var(--text-secondary);
 }

 .order-btn {
 width: 100%;
 margin-top: var(--space-3);
 padding: var(--space-3);
 background: var(--accent-orange);
 color: #000;
 border: none;
 border-radius: var(--radius-md);
 font-weight: var(--font-semibold);
 cursor: pointer;
 }

 /* ===== 底部输入区 ===== */
 .input-area {
 padding: var(--space-4);
 border-top: 1px solid var(--border-subtle);
 background: var(--bg-primary);
 }

 .input-wrapper {
 display: flex;
 align-items: flex-end;
 gap: var(--space-2);
 background: var(--bg-secondary);
 border-radius: var(--radius-xl);
 padding: var(--space-2) var(--space-3);
 border: 1px solid var(--border-subtle);
 }

 .input-wrapper:focus-within {
 border-color: var(--accent-orange);
 }

 .chat-input {
 flex: 1;
 background: transparent;
 border: none;
 color: var(--text-primary);
 font-size: var(--text-base);
 font-family: inherit;
 resize: none;
 max-height: 120px;
 min-height: 24px;
 outline: none;
 padding: var(--space-2);
 }

 .chat-input::placeholder {
 color: var(--text-tertiary);
 }

 .input-btn {
 width: 32px;
 height: 32px;
 border-radius: var(--radius-full);
 border: none;
 display: flex;
 align-items: center;
 justify-content: center;
 cursor: pointer;
 transition: all 0.2s;
 }

 .voice-btn {
 background: var(--bg-tertiary);
 color: var(--text-secondary);
 }

 .voice-btn:hover {
 background: var(--accent-orange);
 color: #000;
 }

 .send-btn {
 background: var(--accent-orange);
 color: #000;
 }

 .send-btn:disabled {
 background: var(--bg-tertiary);
 color: var(--text-tertiary);
 cursor: not-allowed;
 }

 .input-hint {
 text-align: center;
 font-size: var(--text-xs);
 color: var(--text-tertiary);
 margin-top: var(--space-2);
 }

 /* ===== 加载动画 ===== */
 .typing-indicator {
 display: flex;
 gap: var(--space-1);
 padding: var(--space-3) var(--space-4);
 }

 .typing-dot {
 width: 8px;
 height: 8px;
 background: var(--text-secondary);
 border-radius: var(--radius-full);
 animation: typing 1.4s infinite;
 }

 .typing-dot:nth-child(2) { animation-delay: 0.2s; }
 .typing-dot:nth-child(3) { animation-delay: 0.4s; }

 @keyframes typing {
 0%, 60%, 100% { transform: translateY(0); }
 30% { transform: translateY(-10px); }
 }

 /* ===== 快捷操作 ===== */
 .quick-actions {
 display: flex;
 gap: var(--space-2);
 padding: 0 var(--space-4) var(--space-3);
 overflow-x: auto;
 -webkit-overflow-scrolling: touch;
 }

 .quick-action-btn {
 display: flex;
 align-items: center;
 gap: var(--space-2);
 padding: var(--space-2) var(--space-3);
 background: var(--bg-secondary);
 border: 1px solid var(--border-subtle);
 border-radius: var(--radius-md);
 color: var(--text-secondary);
 font-size: var(--text-sm);
 white-space: nowrap;
 cursor: pointer;
 transition: all 0.2s;
 }

 .quick-action-btn:hover {
 background: var(--bg-tertiary);
 color: var(--text-primary);
 border-color: rgba(255,255,255,0.2);
 }

 .quick-action-btn svg {
 width: 16px;
 height: 16px;
 }

 /* ===== Toast ===== */
 .toast {
 position: fixed;
 bottom: 100px;
 left: 50%;
 transform: translateX(-50%);
 background: var(--bg-secondary);
 color: var(--text-primary);
 padding: var(--space-3) var(--space-5);
 border-radius: var(--radius-lg);
 font-size: var(--text-sm);
 border: 1px solid var(--border-subtle);
 display: none;
 }

 .toast.show {
 display: block;
 animation: fadeIn 0.3s;
 }

 @keyframes fadeIn {
 from { opacity: 0; transform: translateX(-50%) translateY(10px); }
 to { opacity: 1; transform: translateX(-50%) translateY(0); }
 }

 /* ===== 送修方式选择弹窗 ===== */
 .modal-overlay {
 position: fixed;
 top: 0;
 left: 0;
 right: 0;
 bottom: 0;
 background: rgba(0,0,0,0.8);
 display: none;
 align-items: center;
 justify-content: center;
 z-index: 1000;
 padding: var(--space-4);
 }

 .modal-overlay.show {
 display: flex;
 }

 .modal-content {
 background: var(--bg-secondary);
 border-radius: var(--radius-xl);
 width: 100%;
 max-width: 400px;
 max-height: 80vh;
 overflow-y: auto;
 border: 1px solid var(--border-subtle);
 }

 .modal-header {
 padding: var(--space-4);
 border-bottom: 1px solid var(--border-subtle);
 text-align: center;
 }

 .modal-title {
 font-size: var(--text-lg);
 font-weight: var(--font-semibold);
 }

 .modal-body {
 padding: var(--space-4);
 }

 .delivery-options {
 display: flex;
 gap: var(--space-3);
 margin-bottom: var(--space-4);
 }

 .delivery-option {
 flex: 1;
 padding: var(--space-4);
 background: var(--bg-tertiary);
 border: 2px solid var(--border-subtle);
 border-radius: var(--radius-lg);
 text-align: center;
 cursor: pointer;
 transition: all 0.2s;
 }

 .delivery-option:hover {
 border-color: var(--accent-orange);
 }

 .delivery-option.selected {
 border-color: var(--accent-orange);
 background: rgba(255,149,0,0.1);
 }

 .delivery-option-icon {
 width: 48px;
 height: 48px;
 margin: 0 auto var(--space-2);
 background: var(--bg-secondary);
 border-radius: var(--radius-full);
 display: flex;
 align-items: center;
 justify-content: center;
 }

 .delivery-option-icon svg {
 width: 24px;
 height: 24px;
 color: var(--accent-orange);
 }

 .delivery-option-title {
 font-weight: var(--font-semibold);
 margin-bottom: var(--space-1);
 }

 .delivery-option-desc {
 font-size: var(--text-xs);
 color: var(--text-secondary);
 }

 .delivery-form {
 display: none;
 }

 .delivery-form.show {
 display: block;
 }

 .form-group {
 margin-bottom: var(--space-3);
 }

 .form-label {
 display: block;
 font-size: var(--text-sm);
 color: var(--text-secondary);
 margin-bottom: var(--space-2);
 }

 .form-input, .form-select {
 width: 100%;
 padding: var(--space-3);
 background: var(--bg-tertiary);
 border: 1px solid var(--border-subtle);
 border-radius: var(--radius-md);
 color: var(--text-primary);
 font-size: var(--text-base);
 font-family: inherit;
 }

 .form-input:focus, .form-select:focus {
 outline: none;
 border-color: var(--accent-orange);
 }

 .form-input::placeholder {
 color: var(--text-tertiary);
 }

 .form-input.error {
 border-color: var(--accent-red);
 }

 .error-msg {
 font-size: var(--text-xs);
 color: var(--accent-red);
 margin-top: var(--space-1);
 }

 .retry-count {
 font-size: var(--text-xs);
 color: var(--text-secondary);
 margin-top: var(--space-1);
 }

 .shop-address {
 background: var(--bg-tertiary);
 padding: var(--space-3);
 border-radius: var(--radius-md);
 margin-bottom: var(--space-3);
 }

 .shop-address-title {
 font-weight: var(--font-semibold);
 margin-bottom: var(--space-2);
 display: flex;
 align-items: center;
 gap: var(--space-2);
 }

 .shop-address-title svg {
 width: 16px;
 height: 16px;
 color: var(--accent-orange);
 }

 .shop-address-text {
 font-size: var(--text-sm);
 color: var(--text-secondary);
 line-height: 1.6;
 }

 .modal-footer {
 padding: var(--space-4);
 border-top: 1px solid var(--border-subtle);
 display: flex;
 gap: var(--space-2);
 }

 .modal-btn {
 flex: 1;
 padding: var(--space-3);
 border: none;
 border-radius: var(--radius-md);
 font-weight: var(--font-semibold);
 cursor: pointer;
 font-size: var(--text-base);
 }

 .modal-btn-primary {
 background: var(--accent-orange);
 color: #000;
 }

 .modal-btn-primary:disabled {
 background: var(--bg-tertiary);
 color: var(--text-tertiary);
 cursor: not-allowed;
 }

 .modal-btn-secondary {
 background: var(--bg-tertiary);
 color: var(--text-primary);
 border: 1px solid var(--border-subtle);
 }
 </style>
</head>

 const res = await fetch(`${API_BASE}/order/query_by_client?client_id=${CLIENT_ID}`);

 orders = orders.concat(data.orders);

 if (savedPhone) {
 try {
 const res = await fetch(`${API_BASE}/order/query?phone=${savedPhone}`);

 const existingNos = new Set(orders.map(o => o.order_no));
 data.orders.forEach(o => {
 if (!existingNos.has(o.order_no)) orders.push(o);
 });
 }
 } catch (e) {}
 }

 orders.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

 function cancelAddressForm() {
 const formBox = document.getElementById('addressFormBox');
 if (formBox) formBox.style.display = 'none';
 }

 function saveAddress(index = -1) {
 const name = document.getElementById('addrName').value.trim();
 const phone = document.getElementById('addrPhone').value.trim();
 const province = document.getElementById('addrProvince').value.trim();
 const city = document.getElementById('addrCity').value.trim();
 const district = document.getElementById('addrDistrict').value.trim();
 const detail = document.getElementById('addrDetail').value.trim();
 const isDefault = document.getElementById('addrDefault')?.checked || false;

 if (!name || !phone || !province || !city || !detail) {
 alert('请填写完整地址信息');
 return;
 }

 // 保存客户姓名到 localStorage，用于订单
 localStorage.setItem('customerName', name);
 if (!/^1[3-9]\d{9}$/.test(phone)) {
 alert('手机号格式不正确');
 return;
 }

 let addresses = getSavedAddresses();
 const newAddr = { name, phone, province, city, district, detail, isDefault };

 if (isDefault) {
 addresses.forEach(a => a.isDefault = false);
 }

 if (index >= 0) {
 addresses[index] = newAddr;
 } else {
 if (addresses.length === 0) newAddr.isDefault = true;
 addresses.push(newAddr);
 }

 saveAddresses(addresses);
 renderAddressBook();
 showToast('地址已保存');
 }

 function editAddress(index) {
 renderAddressBook();
 showAddressForm(index);
 }

 function deleteAddress(index) {
 if (!confirm('确定删除这个地址吗?')) return;
 let addresses = getSavedAddresses();
 addresses.splice(index, 1);
 saveAddresses(addresses);
 renderAddressBook();
 showToast('地址已删除');
 }

 async function loadMyOrders() {
 const phone = document.getElementById('queryPhoneInput').value.trim().replace(/\s+/g, '');
 if (!phone) {
 alert('请输入手机号');
 return;
 }
 if (!/^1[3-9]\d{9}$/.test(phone)) {
 alert('手机号格式不正确');
 return;
 }

 localStorage.setItem('customerPhone', phone);
 const content = document.getElementById('orderListContent');
 content.innerHTML = '<div style="text-align: center; padding: 40px;">加载中...</div>';

 try {
 const res = await fetch(`${API_BASE}/order/query?phone=${phone}`);
 const data = await res.json();

 if (data.success && data.orders && data.orders.length > 0) {
 renderOrderList(data.orders);
 } else {
 content.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-secondary);">暂无订单</div>';
 }
 } catch (e) {
 content.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--accent-red);">加载失败</div>';
 }
 }

 function renderOrderList(orders, showPhoneSwitch = false) {
 const content = document.getElementById('orderListContent');

 const statusMap = {
 'pending': { text: '待接单', color: '#FF9500' },
 'assigned': { text: '已分配维修点', color: '#AF52DE', action: '选择送修方式' },
 'accepted': { text: '已接单', color: '#0A84FF' },
 'received': { text: '待检测', color: '#5856D6' },
 'detected': { text: '检测完成', color: '#AF52DE' },
 'inspected': { text: '检测中', color: '#BF5AF2' },
 'quoted': { text: '待确认报价', color: '#FF9F0A' },
 'confirmed': { text: '待维修', color: '#FF453A' },
 'repairing': { text: '维修中', color: '#30D158' },
 'repaired': { text: '待发货', color: '#30D158' },
 'shipping': { text: '待发货', color: '#30D158' },
 'delivered': { text: '待收货', color: '#30D158' },
 'completed': { text: '已完成', color: '#30D158' },
 'cancelled': { text: '已取消', color: '#8E8E93' }
 };

 let html = orders.map(order => {
 const status = statusMap[order.status] || { text: order.status, color: '#8E8E93' };
 let actionHtml = '';
 if (order.status === 'assigned') {
 actionHtml = `
 <button onclick="event.stopPropagation(); selectDeliveryForOrder('${order.order_no}', '${order.merchant_name || '系统'}')"
 style="width: 100%; padding: 12px; background: var(--accent-orange); border: none; border-radius: 12px; color: #000; font-weight: 600; cursor: pointer; margin-top: 10px; white-space: nowrap;">
 选择送修方式
 </button>
 `;
 } else if (order.status === 'quoted') {
 if (!order.deposit_paid) {
 actionHtml = `
 <div style="display: flex; gap: 8px; margin-top: 10px;" onclick="event.stopPropagation();">
 <button onclick="payDeposit('${order.order_no}')" style="flex: 1; padding: 12px; background: var(--accent-green); border: none; border-radius: 12px; color: #000; font-weight: 600; cursor: pointer; white-space: nowrap;">✓ 接受并付定金 ¥${order.deposit_amount || 0}</button>
 <button onclick="confirmQuote('${order.order_no}', false)" style="flex: 1; padding: 12px; background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: 12px; color: var(--accent-red); font-weight: 600; cursor: pointer;">✕ 拒绝</button>
 </div>
 `;
 } else {
 actionHtml = `
 <div style="display: flex; gap: 8px; margin-top: 10px;" onclick="event.stopPropagation();">
 <button onclick="confirmQuote('${order.order_no}', true)" style="flex: 1; padding: 12px; background: var(--accent-green); border: none; border-radius: 12px; color: #000; font-weight: 600; cursor: pointer; white-space: nowrap;">✓ 接受报价</button>
 <button onclick="confirmQuote('${order.order_no}', false)" style="flex: 1; padding: 12px; background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: 12px; color: var(--accent-red); font-weight: 600; cursor: pointer; white-space: nowrap;">✕ 拒绝报价</button>
 </div>
 `;
 }
 } else if (['repaired','shipping'].includes(order.status)) {
 const pendingFinal = Math.max(0, (order.quote_amount || 0) - (order.deposit_amount || 0));
 if (pendingFinal > 0 && !order.final_paid) {
 actionHtml = `
 <div style="margin-top: 10px;" onclick="event.stopPropagation();">
 <button onclick="payFinal('${order.order_no}')" style="width: 100%; padding: 12px; background: var(--accent-orange); border: none; border-radius: 12px; color: #000; font-weight: 600; cursor: pointer; white-space: nowrap;">支付尾款 ¥${pendingFinal}</button>
 <div style="text-align: center; font-size: 12px; color: var(--text-secondary); margin-top: 6px;">付清尾款后商家将尽快发货</div>
 </div>
 `;
 } else {
 actionHtml = `
 <div style="margin-top: 10px;">
 <button disabled style="width: 100%; padding: 12px; background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: 12px; color: var(--text-secondary); font-weight: 600; cursor: not-allowed;">等待商家发货</button>
 </div>
 `;
 }
 } else if (order.status === 'delivered') {
 const countdown = getAutoConfirmCountdown(order);
 actionHtml = `
 <div style="margin-top: 10px;" onclick="event.stopPropagation();">
 <button onclick="confirmReceiveOrder('${order.order_no}')" style="width: 100%; padding: 12px; background: var(--accent-blue); border: none; border-radius: 12px; color: #fff; font-weight: 600; cursor: pointer;">确认收货</button>

 </div>

 }

 const hasPrice = ['quoted','confirmed','repairing','repaired','delivered','completed'].includes(order.status);
 const priceLabel = hasPrice ? `
 <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-subtle);">
 <span style="font-size: 13px; color: var(--text-secondary);">${order.merchant_name ? order.merchant_name + ' · ' : ''}报价</span>
 <span style="font-weight: 600; color: var(--accent-orange);">¥${order.quote_amount || order.estimated_price || '-'}</span>
 </div>
 ` : '';

 return `
 <div style="background: var(--bg-tertiary); border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border-subtle); cursor: pointer; transition: background 0.15s;"

 <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
 <span style="font-family: monospace; font-weight: 600;">${order.order_no}</span>
 <span style="color: ${status.color}; font-size: 14px; font-weight: 500;">${status.text}</span>
 </div>
 <div style="color: var(--text-secondary); font-size: 14px; margin-bottom: 4px;">
 ${order.drone_model} · ${order.problem_description?.substring(0, 20) || '无描述'}...
 </div>
 <div style="color: var(--text-tertiary); font-size: 12px;">
 ${order.created_at?.split('T')[0] || '-'}
 </div>
 ${priceLabel}
 ${actionHtml}
 </div>
 `;
 }).join('');

 if (showPhoneSwitch) {
 html += `
 <div style="text-align: center; margin-top: 16px;">
 <button onclick="event.stopPropagation(); showPhoneSearchFallback()" style="padding: 10px 20px; background: transparent; border: 1px solid var(--border-subtle); border-radius: 8px; color: var(--text-secondary); font-size: 13px; cursor: pointer;">
 按手机号查询其他订单
 </button>
 </div>
 `;
 }

 content.innerHTML = html;
 }

 function showPhoneSearchFallback() {
 const content = document.getElementById('orderListContent');
 const savedPhone = localStorage.getItem('customerPhone') || '';
 content.innerHTML = `
 <div style="text-align: center; padding: 24px; color: var(--text-secondary);">
 <div style="font-size: 13px; margin-bottom: 12px;">输入下单时填写的手机号</div>
 <input type="tel" id="queryPhoneInput" placeholder="手机号" value="${savedPhone}" style="width: 100%; padding: 12px; background: var(--bg-tertiary); border: 1px solid var(--border-subtle); border-radius: 12px; color: var(--text-primary); font-size: 16px;">
 <button onclick="loadMyOrders()" style="width: 100%; margin-top: 12px; padding: 12px; background: var(--accent-orange); border: none; border-radius: 12px; color: #000; font-weight: 600; cursor: pointer;">查询</button>
 </div>
 `;
 setTimeout(() => {
 const input = document.getElementById('queryPhoneInput');
 if (input) {
 input.addEventListener('keypress', (e) => { if (e.key === 'Enter') loadMyOrders(); });
 input.focus();

 }, 0);

 async function showOrderDetail(orderNo) {
 const modal = document.getElementById('orderDetailModal');
 const content = document.getElementById('orderDetailContent');
 const header = document.getElementById('orderDetailHeader');
 modal.style.display = 'block';
 header.style.background = 'var(--bg-tertiary)';
 content.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-secondary);">加载中...</div>';

 try {
 const res = await fetch(`${API_BASE}/order/detail?order_no=${encodeURIComponent(orderNo)}`);
 const data = await res.json();
 if (!data.success || !data.order) {
 content.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--accent-red);">加载失败，订单不存在</div>';
 return;
 }

 const order = data.order;
 const statusMap = {
 'pending': { text: '待接单', color: '#FF9500' },
 'assigned': { text: '已分配维修点', color: '#AF52DE' },
 'accepted': { text: '已接单/待收货', color: '#0A84FF' },
 'received': { text: '待检测', color: '#5856D6' },
 'detected': { text: '检测完成', color: '#AF52DE' },
 'inspected': { text: '检测中', color: '#BF5AF2' },
 'quoted': { text: '待确认报价', color: '#FF9F0A' },
 'confirmed': { text: '待维修', color: '#FF453A' },
 'repairing': { text: '维修中', color: '#30D158' },
 'repaired': { text: '待发货', color: '#30D158' },
 'delivered': { text: '待收货', color: '#30D158' },
 'completed': { text: '已完成', color: '#30D158' },
 'cancelled': { text: '已取消', color: '#8E8E93' }
 };
 const status = statusMap[order.status] || { text: order.status, color: '#8E8E93' };

 // 解析检测报告
 let detectionHtml = '';
 let requiredTotal = 0;
 let optionalTotal = 0;
 if (order.detection_result) {
 let d = order.detection_result;
 if (typeof d === 'string') {
 try { d = JSON.parse(d); } catch (e) {}
 }
 if (typeof d === 'object' && d !== null) {
 const faultDesc = d.fault_description || d.actual_problem || '';
 const repairPlan = d.repair_plan || '';

 let requiredParts = [];
 let optionalParts = [];

 // 优先读取新结构的 required_parts / optional_parts
 if (Array.isArray(d.required_parts)) {
 requiredParts = d.required_parts.map(p => typeof p === 'string' ? {name:p, total_price:0} : {name: p.name || String(p), total_price: p.total_price || 0});
 }
 if (Array.isArray(d.optional_parts)) {
 optionalParts = d.optional_parts.map(p => typeof p === 'string' ? {name:p, total_price:0} : {name: p.name || String(p), total_price: p.total_price || 0});
 }

 // 兼容旧结构：从 parts_list / parts_needed / damage_parts 拆分
 if (!requiredParts.length && !optionalParts.length) {
 let partsList = [];
 if (Array.isArray(d.parts_list)) partsList = d.parts_list;
 else if (d.parts_needed) partsList = d.parts_needed.split(/[,，、]/).filter(x => x.trim());
 else if (Array.isArray(d.damage_parts)) partsList = d.damage_parts;

 const aiParts = (order.ai_diagnosis && order.ai_diagnosis.parts_list) || [];
 const aiPartNames = Array.isArray(aiParts) ? aiParts.map(p => typeof p === 'string' ? p : p.name) : [];
 partsList.forEach(p => {
 const pName = typeof p === 'string' ? p : p.name;
 if (aiPartNames.some(aip => pName.includes(aip) || aip.includes(pName))) {
 requiredParts.push({name: pName, total_price: 0});
 } else {
 optionalParts.push({name: pName, total_price: 0});
 }
 });
 if (!requiredParts.length && !optionalParts.length && partsList.length) {
 requiredParts = partsList.map(p => typeof p === 'string' ? {name: p, total_price: 0} : {name: p.name, total_price: 0});
 }
 }

 requiredTotal = requiredParts.reduce((sum, p) => sum + (p.total_price || 0), 0);
 optionalTotal = optionalParts.reduce((sum, p) => sum + (p.total_price || 0), 0);

 const requiredHtml = requiredParts.length ? requiredParts.map((p, idx) => `
 <label style="display:flex; align-items:center; gap:8px; margin-bottom:8px; cursor:default; font-size:13px; color:var(--text-secondary);">
 <input type="checkbox" checked disabled style="width:16px; height:16px; accent-color:var(--accent-green); flex-shrink:0;">
 <span style="flex:1;">${p.name}</span>
 <span style="font-size:12px; color:var(--text-secondary); margin-right:4px;">¥${p.total_price}</span>
 <span style="font-size:11px; color:var(--text-tertiary); background:var(--bg-secondary); padding:2px 6px; border-radius:4px;">必修</span>
 </label>
 `).join('') : '<div style="font-size:13px; color:var(--text-tertiary);">待商家补充</div>';

 const optionalHtml = optionalParts.length ? optionalParts.map((p, idx) => `
 <label style="display:flex; align-items:center; gap:8px; margin-bottom:8px; cursor:pointer; font-size:13px; color:var(--text-secondary);"
 onchange="updateMerchantReportTotal()"
 >
 <input type="checkbox" class="opt-checkbox" value="${p.name}" data-price="${p.total_price}" checked style="width:16px; height:16px; accent-color:var(--accent-blue); flex-shrink:0;">
 <span style="flex:1;" class="opt-name">${p.name}</span>
 <span style="font-size:12px; color:var(--text-secondary); margin-right:4px;">¥${p.total_price}</span>
 <span style="font-size:11px; color:var(--accent-blue); background:rgba(10,132,255,0.1); padding:2px 6px; border-radius:4px;">选修</span>
 </label>
 `).join('') : '<div style="font-size:13px; color:var(--text-tertiary);">无选修项目</div>';

 detectionHtml = `
 <div class="merchant-report-box" style="background: var(--bg-tertiary); border-radius: 12px; padding: 14px; border: 1px solid var(--border-subtle); margin-bottom: 14px;" data-required-total="${requiredTotal}" data-base-quote="${order.quote_amount || 0}">
 <div style="font-weight: 600; margin-bottom: 10px; font-size: 14px;">商家检测报告</div>
 <div style="font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 10px;">
 ${faultDesc ? '<div><strong>故障描述：</strong>' + faultDesc + '</div>' : ''}
 ${repairPlan ? '<div><strong>维修方案：</strong>' + repairPlan + '</div>' : ''}
 </div>
 <div style="margin-bottom: 10px;">
 <div style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 6px;">建议维修项目（必修）</div>
 ${requiredHtml}
 </div>
 <div style="margin-bottom: 10px;">
 <div style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 6px;">可选维修项目（选修）</div>
 ${optionalHtml}
 </div>
 </div>
 `;
 } else {
 detectionHtml = `
 <div style="background: var(--bg-tertiary); border-radius: 12px; padding: 14px; border: 1px solid var(--border-subtle); margin-bottom: 14px;">
 <div style="font-weight: 600; margin-bottom: 8px;">商家检测报告</div>
 <div style="font-size: 13px; color: var(--text-secondary); line-height: 1.7;">${String(d)}</div>
 </div>
 `;
 }
 } else if (order.ai_diagnosis && order.ai_diagnosis.causes) {
 detectionHtml = `
 <div style="background: var(--bg-tertiary); border-radius: 12px; padding: 14px; border: 1px solid var(--border-subtle); margin-bottom: 14px;">

 </div>
 </div>
 `;
 }

 // 费用明细

 if (order.quote_amount || order.estimated_price) {
 let partsCost = '-';
 let laborCost = '-';
 if (order.quote_data) {
 try {
 const qd = (typeof order.quote_data === 'string') ? JSON.parse(order.quote_data) : order.quote_data;
 partsCost = (qd.parts_cost !== undefined) ? qd.parts_cost : '-';
 laborCost = (qd.labor_cost !== undefined) ? qd.labor_cost : '-';

 }
 costHtml = `

 <div style="font-weight: 600; margin-bottom: 10px;">费用明细</div>

 <span style="color: var(--text-secondary);">工时费用</span>
 <span>¥${laborCost}</span>

 <div style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-subtle);">

 async function handleConversation(message) {
 try {
 const response = await fetch(`${API_BASE}/ai/parse`, {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ text: message })
 });

 const data = await response.json();
 hideTyping();

 if (!data.success) {
 addMessage('抱歉,我遇到了一些问题,请稍后再试。', 'ai');
 return;
 }

 const drone = data.entities?.drone;
 const intent = data.intent;

 switch(conversationState.step) {
 case 'welcome':
 case 'ask_drone':
 if (drone) {
 conversationState.drone = drone;
 conversationState.step = 'ask_problem';
 addMessage(`收到,${drone}。请描述故障现象,比如:<br>• 云台不转或抖动<br>• 无法起飞<br>• 图传信号不稳定<br>• 电池充不进电`, 'ai');
 } else if (intent === 'query') {
 showOrderQueryForm();
 } else {
 conversationState.step = 'ask_drone';
 addMessage('请告诉我你的无人机机型,比如 Mini 3 Pro、Air 3 或 Mavic 3。', 'ai');
 }
 break;

 case 'ask_problem':
 conversationState.problem = message;
 await generateDiagnosisReport(conversationState.drone, message);
 conversationState.step = 'show_report';
 break;

 case 'show_report':
 case 'confirm_order':
 if (message.includes('下单') || message.includes('创建') || message.includes('确认')) {
 startCreateOrder();
 } else if (intent === 'query') {
 showOrderQueryForm();
 } else {
 addMessage('请问还有其他问题吗?我可以帮你查询订单进度或获取其他机型的报价。', 'ai');
 }
 break;
 }
 } catch (e) {
 hideTyping();
 addMessage('网络连接失败,请检查网络后重试。', 'ai');
 }
 }

 function updateMerchantReportTotal() {

 if (!reportBox) return;
 const requiredTotal = parseFloat(reportBox.dataset.requiredTotal || '0');
 const checkedOpts = reportBox.querySelectorAll('.opt-checkbox:checked');
 let optTotal = 0;
 const selectedNames = [];
 checkedOpts.forEach(cb => {
 optTotal += parseFloat(cb.dataset.price || '0');
 selectedNames.push(cb.value);
 });
 const newTotal = requiredTotal + optTotal;

 const totalEl = document.getElementById('detail-total-price');
 if (totalEl) totalEl.textContent = '¥' + newTotal.toFixed(2);

 const quoteEl = document.getElementById('pay-quote-amount');
 if (quoteEl) quoteEl.textContent = '¥' + newTotal.toFixed(2);

 let deposit = 0;
 if (newTotal > 0 && newTotal < 200) deposit = 50;
 else if (newTotal >= 200 && newTotal < 500) deposit = 100;
 else if (newTotal >= 500) deposit = 200;

 const depositEl = document.getElementById('detail-deposit-amount');
 if (depositEl) depositEl.textContent = '¥' + deposit;

 const depositStatusEl = document.getElementById('pay-deposit-status');
 if (depositStatusEl) {
 const paid = depositStatusEl.textContent.includes('已付');
 depositStatusEl.innerHTML = (paid ? '已付 ' : '待付 ') + '<span id="detail-deposit-amount">¥' + deposit + '</span>';
 }

 const finalEl = document.getElementById('detail-final-amount');
 if (finalEl) finalEl.textContent = '¥' + Math.max(0, newTotal - deposit).toFixed(2);

 reportBox.dataset.selectedOptional = JSON.stringify(selectedNames);
 }

 function analyzeProblemFallback(drone, problem) {
 const problemLower = problem.toLowerCase();
 const faultMap = {
 '云台': { keywords: ['云台', 'gimbal', '抖动', '不转', '歪了', '电机'], causes: ['云台电机损坏、云台控制板故障或云台结构件磨损'], parts_list: [{name:'云台电机', total_price:230}, {name:'云台排线', total_price:80}], total_price: 450 },
 '图传': { keywords: ['图传', '信号', '画面', '花屏', '断连'], causes: ['图传模块损坏、天线接触不良或信号线断裂'], parts_list: [{name:'图传模块', total_price:260}], total_price: 380 },
 '电池': { keywords: ['电池', '充电', '续航', '电量', '鼓包'], causes: ['电芯老化、电池管理板故障或充电接口损坏'], parts_list: [{name:'电池', total_price:200}], total_price: 320 },
 '飞行': { keywords: ['起飞', '飞行', '电机', '螺旋桨', '失控'], causes: ['电机损坏、电调故障或飞控系统异常'], parts_list: [{name:'电机', total_price:150}, {name:'电调', total_price:200}], total_price: 520 },
 '摄像头': { keywords: ['摄像头', '镜头', '拍照', '录像', '模糊'], causes: ['摄像头模组损坏或图像处理芯片故障'], parts_list: [{name:'摄像头模组'}, {name:'图像处理板'}], total_price: 680 }
 };

 let matched = null;
 for (const [type, config] of Object.entries(faultMap)) {
 if (config.keywords.some(k => problemLower.includes(k))) {
 matched = config;
 break;
 }
 }

 if (!matched) {
 matched = { causes: ['需要专业工程师检测后确定具体故障原因'], parts_list: [{name:'待检测'}], total_price: 200 };
 }

 const modelMultiplier = drone.includes('Mavic 3') ? 1.5 : drone.includes('Air 3') ? 1.3 : 1.0;
 return { ...matched, total_price: Math.round(matched.total_price * modelMultiplier), data_driven: false, history_samples: 0 };
 }

 document.getElementById('shopForm').classList.remove('show');

 document.getElementById('shopOption').classList.toggle('selected', type === 'shop');
 document.getElementById('expressForm').classList.toggle('show', type === 'express');
 document.getElementById('shopForm').classList.toggle('show', type === 'shop');
 updateConfirmButton();

 function validateExpressNumber() {
 const company = document.getElementById('expressCompany').value;
 const number = document.getElementById('expressNumber').value.trim().toUpperCase();
 const errorDiv = document.getElementById('expressError');
 const input = document.getElementById('expressNumber');

 if (!company) { errorDiv.textContent = '请先选择快递公司'; input.classList.add('error'); return false; }
 if (!number) { errorDiv.textContent = '请输入快递单号'; input.classList.add('error'); return false; }
 const rule = expressRules[company];
 if (rule && !rule.test(number)) { errorDiv.textContent = `${company}单号格式不正确`; input.classList.add('error'); return false; }

 errorDiv.textContent = '';
 input.classList.remove('error');
 return true;
 }

 const btn = document.getElementById('confirmDeliveryBtn');

 if (deliveryType === 'express') {

 btn.disabled = !company || !number;

 btn.disabled = !document.getElementById('appointmentTime').value;
 }

 // ========== 通知系统 ==========
 async function startPolling(orderNo, phone) {
 if (pollingOrders[orderNo]) return;

 // 先获取当前真实状态作为初始值,避免误报
 let initialStatus = 'pending';
 try {
 const res = await fetch(`${API_BASE}/order/detail?order_no=${encodeURIComponent(orderNo)}`);
 const data = await res.json();
 if (data.success && data.order) {
 initialStatus = data.order.status;
 }
 } catch (e) {
 console.error('[Polling] 获取初始状态失败:', e);
 }

 pollingOrders[orderNo] = { phone: phone, status: initialStatus };
 console.log('[Polling] 开始轮询订单:', orderNo, '初始状态:', initialStatus);

 const intervalId = setInterval(() => {
 if (!pollingOrders[orderNo]) { clearInterval(intervalId); return; }
 checkOrderStatus(orderNo, phone);
 }, 10000);
 pollingOrders[orderNo].intervalId = intervalId;

 // 立即执行一次检查,避免等30秒才能看到变化
 setTimeout(() => checkOrderStatus(orderNo, phone), 0);
 }

 function stopPolling(orderNo) {
 if (pollingOrders[orderNo]) {
 clearInterval(pollingOrders[orderNo].intervalId);
 delete pollingOrders[orderNo];
 }
 }

 async function checkOrderStatus(orderNo, phone) {
 try {
 const res = await fetch(`${API_BASE}/order/detail?order_no=${encodeURIComponent(orderNo)}`);
 const data = await res.json();
 if (!data.success || !data.order) return;

 const order = data.order;
 const lastStatus = pollingOrders[orderNo]?.status;

 if (lastStatus && lastStatus !== order.status) {
 handleStatusChange(order, lastStatus);
 }
 if (pollingOrders[orderNo]) pollingOrders[orderNo].status = order.status;
 if (['completed', 'cancelled'].includes(order.status)) stopPolling(orderNo);
 } catch (e) {}
 }

 function handleStatusChange(order, oldStatus) {
 document.getElementById('menuBadge').style.display = 'block';
 const statusMessages = {
 'assigned': { title: '商家已接单!', content: `${order.merchant_name || '维修点'} 已接单,请选择送修方式`, action: () => selectDeliveryForOrder(order.order_no, order.merchant_name || '系统') },
 'accepted': { title: '送修方式已确认', content: '商家已确认,准备开始检测', action: () => showToast('送修方式已确认') },
 'inspected': { title: '检测完成', content: '故障已检测,请查看报价', action: () => showOrderDetail(order.order_no) },
 'quoted': { title: '报价已生成', content: '请确认是否接受报价', action: () => showOrderDetail(order.order_no) },
 'repairing': { title: '开始维修', content: '设备已进入维修阶段', action: () => showToast('开始维修') },
 'delivered': { title: '维修完成,已发货', content: `快递: ${order.merchant_carrier || '未知'} ${order.merchant_tracking_no || ''}`, action: () => showOrderDetail(order.order_no) },
 'completed': { title: '订单已完成', content: '感谢您的使用', action: () => showToast('订单已完成') }
 };

 const msg = statusMessages[order.status];
 if (msg) showNotification(msg.title, msg.content, msg.action);
 }

 function showNotification(title, content, action) {
 currentNotification = action;
 document.getElementById('notifTitle').textContent = title;
 document.getElementById('notifContent').textContent = content;
 document.getElementById('notificationToast').style.display = 'block';
 setTimeout(() => document.getElementById('notificationToast').style.display = 'none', 10000);
 }

 function handleNotificationClick() {
 document.getElementById('notificationToast').style.display = 'none';
 if (currentNotification) {
 currentNotification();
 currentNotification = null;
 }
 }

 async function restorePolling(phone) {
 try {
 const res = await fetch(`${API_BASE}/order/query?phone=${phone}`);
 const data = await res.json();
 if (data.success && data.orders) {
 data.orders.forEach(order => {
 if (!['completed', 'cancelled'].includes(order.status)) startPolling(order.order_no, phone);
 });
 }
 } catch (e) {}
 }

 setTimeout(() => toast.classList.remove('show'), 3000);

 function startVoice() {
 alert('语音输入功能开发中,请使用文字输入');
 }

 async function refreshOrderList() {
 const content = document.getElementById('orderListContent');
 const savedPhone = localStorage.getItem('customerPhone') || '';
 let orders = [];
 if (CLIENT_ID) {
 try {
 const res = await fetch(`${API_BASE}/order/query_by_client?client_id=${CLIENT_ID}`);
 const data = await res.json();
 if (data.success && data.orders) orders = orders.concat(data.orders);
 } catch (e) {}
 }
 if (savedPhone) {
 try {
 const res = await fetch(`${API_BASE}/order/query?phone=${savedPhone}`);
 const data = await res.json();
 if (data.success && data.orders) {
 const existingNos = new Set(orders.map(o => o.order_no));
 data.orders.forEach(o => { if (!existingNos.has(o.order_no)) orders.push(o); });
 }
 } catch (e) {}
 }
 orders.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
 if (orders.length > 0) {
 renderOrderList(orders, true);
 } else {
 content.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-secondary);">暂无订单</div>';
 }
 }

 // ========== 缺失函数补充 ==========
 async function confirmQuote(orderNo, accept, preselectedOptional = null) {
 if (!confirm(accept ? '确认接受此报价?接受后商家将开始维修。' : '确认拒绝此报价?拒绝后订单将取消。')) return;
 let selectedOptional = preselectedOptional;
 if (selectedOptional === null) {
 const reportBox = document.querySelector('.merchant-report-box');
 if (reportBox && reportBox.dataset.selectedOptional) {
 try { selectedOptional = JSON.parse(reportBox.dataset.selectedOptional); } catch (e) {}
 }
 }
 showToast('正在提交...');
 try {
 const res = await fetch(`${API_BASE}/order/confirm_quote`, {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ order_no: orderNo, confirmed: accept, selected_optional: selectedOptional || [] })
 });
 const data = await res.json();
 if (data.success) {
 showToast(accept ? '✅ 已接受报价' : '❌ 已拒绝报价,订单取消');
 startPolling(orderNo, localStorage.getItem('customerPhone') || '');
 closeOrderDetail();
 if (document.getElementById('orderListModal').style.display === 'block') {
 refreshOrderList();
 }
 } else {
 showToast('❌ ' + (data.message || '操作失败'));
 }
 } catch (e) {
 showToast('❌ 网络错误');
 }
 }

 async function viewOrderDetailByNo(orderNo) {
 showOrderDetail(orderNo);
 }

 function getAutoConfirmCountdown(order) {
 const baseTime = order.merchant_ship_time || order.updated_at;
 if (!baseTime) return null;
 const deadline = new Date(new Date(baseTime).getTime() + 7 * 24 * 60 * 60 * 1000);
 const now = new Date();
 const diff = deadline - now;
 if (diff <= 0) return '已自动确认';
 const days = Math.floor(diff / (24 * 60 * 60 * 1000));
 const hours = Math.floor((diff % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
 return `剩余 ${days}天${hours}小时自动确认`;
 }

 async function payDeposit(orderNo) {
 let selectedOptional = [];
 const reportBox = document.querySelector('.merchant-report-box');
 if (reportBox && reportBox.dataset.selectedOptional) {
 try { selectedOptional = JSON.parse(reportBox.dataset.selectedOptional); } catch (e) {}
 }
 showToast('正在发起定金支付...');
 try {
 const res = await fetch(`${API_BASE}/pay/create-deposit`, {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ order_no: orderNo, selected_optional: selectedOptional })
 });
 const data = await res.json();
 if (data.success) {
 showToast(`✅ 定金支付成功 ¥${data.deposit_amount}`);
 await confirmQuote(orderNo, true, selectedOptional);
 } else {
 showToast('❌ ' + (data.message || '支付失败'));
 }
 } catch (e) {
 showToast('❌ 网络错误');
 }
 }

 async function payFinal(orderNo) {
 showToast('正在发起尾款支付...');
 try {
 const res = await fetch(`${API_BASE}/pay/create-final`, {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ order_no: orderNo })
 });
 const data = await res.json();
 if (data.success) {
 showToast(`✅ 尾款支付成功 ¥${data.final_amount}`);
 showOrderDetail(orderNo);
 } else {
 showToast('❌ ' + (data.message || '支付失败'));
 }
 } catch (e) {
 showToast('❌ 网络错误');
 }
 }

 async function confirmReceiveOrder(orderNo) {
 if (!confirm('确认已收到维修好的设备？确认后订单将完成。')) return;
 showToast('正在提交...');
 try {
 const res = await fetch(`${API_BASE}/order/receive`, {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ order_no: orderNo })
 });
 const data = await res.json();
 if (data.success) {
 showToast('✅ 确认收货成功，订单已完成');
 closeOrderDetail();
 if (document.getElementById('orderListModal').style.display === 'block') {
 refreshOrderList();
 }
 } else if (data.require_payment) {
 showToast('⚠️ ' + data.message);
 if (data.payment_type === 'final' && data.pending_amount) {
 await payFinal(orderNo);
 }
 } else {
 showToast('❌ ' + (data.message || '操作失败'));
 }
 } catch (e) {
 showToast('❌ 网络错误');
 }
 }
